// ─────────────────────────────────────────────────────────────────
// Queue + mode
//
// Three play modes, switchable from the brand-meta in the corner:
//
//   "shuffled"   — per-pass Fisher-Yates: each track plays exactly
//                  once before any repeats, then reshuffles.
//   "sequential" — play in TRACKS array order, looping at the end.
//   "repeat"     — current track loops indefinitely (audio.loop=true).
//                  Drawer + prev/next still navigate; landing on a
//                  new track in repeat mode means THAT track loops.
//                  Queue order is the visible-tracks default — repeat
//                  doesn't reshuffle.
//
// History tracks visited-order regardless of mode, so Previous walks
// back the way you came.
// ─────────────────────────────────────────────────────────────────
let queue = [];
let queueIdx = -1;
let history = [];     // visited-order, for Previous
let activeIdx = -1;   // index into TRACKS for the currently-loaded track
let started = false;  // has the user clicked play at least once
let activeBg = "a";   // which bg layer is currently visible
let mode = "shuffled";
// content: which subset of tracks/images is visible
//   "played"  — only chapters the reader has reached in the main app
//               (read from localStorage["lirien.save"].bg → ch??_ prefix)
//   "all"     — every track + every chapter image
//   "minimal" — every track playable, but the bg is locked to the
//               wide Solrien vista (already on the landing page,
//               non-spoilery); captions are blanked
//
// Default behavior:
//   - reader with autosave    → "played"  (their reached chapters)
//   - new visitor (no save)   → "minimal" (the wide Solrien vista,
//                                          all tracks accessible,
//                                          no chapter spoilers)
let content = "played";
let reachedChapter = 1;
const HERO_BG_PATH = "../solrien_wide.webp";

// ─────────────────────────────────────────────────────────────────
// Offline music
// ─────────────────────────────────────────────────────────────────
const OFFLINE_MODE_KEY = "echoes.offlineMode";
const offline = {
	enabled: false,
	cacheState: null,
	preloading: false,
	done: 0,
	total: 0,
	doneBytes: 0,
	totalBytes: 0,
	channel: null,
};

function loadOfflineMode(){
	try { return localStorage.getItem(OFFLINE_MODE_KEY) === "true"; }
	catch (e) { return false; }
}
function saveOfflineMode(value){
	offline.enabled = !!value;
	try { localStorage.setItem(OFFLINE_MODE_KEY, offline.enabled ? "true" : "false"); }
	catch (e) { /* private mode */ }
}
offline.enabled = loadOfflineMode();

function offlineItemUrl(url){
	return new URL(url, location.href).href;
}

function offlineItemSize(url){
	if (!ECHOES_ASSET_MANIFEST || !ECHOES_ASSET_MANIFEST.assets) return 0;
	try {
		const pathname = new URL(url, location.href).pathname;
		const entry = ECHOES_ASSET_MANIFEST.assets[pathname];
		return entry && Number(entry.size) > 0 ? Number(entry.size) : 0;
	} catch (e) {
		return 0;
	}
}

function formatBytes(bytes){
	if (!bytes || bytes <= 0) return "";
	const units = ["B", "KB", "MB", "GB"];
	let value = bytes;
	let unit = 0;
	while (value >= 1024 && unit < units.length - 1) {
		value /= 1024;
		unit += 1;
	}
	const decimals = unit >= 2 && value < 100 ? 1 : 0;
	return `${value.toFixed(decimals)} ${units[unit]}`;
}

function buildOfflineItems(){
	const seen = new Set();
	const items = [];
	const add = (url, kind) => {
		if (!url) return;
		const href = offlineItemUrl(url);
		if (seen.has(href)) return;
		seen.add(href);
		items.push({ url: href, kind: kind || "asset", size: offlineItemSize(href) });
	};
	add("./", "shell");
	add("index.html", "shell");
	add("tracks.json", "manifest");
	add("music_progression.json", "manifest");
	add("spiral.png", "image");
	add(HERO_BG_PATH, "image");
	add("icon-192-v3.png", "image");
	add("icon-512-v3.png", "image");
	for (const track of TRACKS) {
		add(trackAudioUrl(track), "audio");
		add(trackImageUrl(track), "image");
	}
	return items;
}

function cachedOfflineCount(){
	return offline.cacheState && Array.isArray(offline.cacheState.cached)
		? offline.cacheState.cached.length
		: 0;
}

function missingOfflineCount(){
	return offline.cacheState && Array.isArray(offline.cacheState.missing)
		? offline.cacheState.missing.length
		: buildOfflineItems().length;
}

function offlineTotalBytes(){
	return buildOfflineItems().reduce((sum, item) => sum + (item.size || 0), 0);
}

function renderOfflinePanel(){
	if (!$offlinePanel) return;
	const t = (window.lirienT || ((k) => k));
	const items = buildOfflineItems();
	const cached = cachedOfflineCount();
	const missing = missingOfflineCount();
	const allGood = items.length > 0 && missing === 0;
	const storageNeeded = formatBytes(offlineTotalBytes());
	let html = "";

	if (!("serviceWorker" in navigator)) {
		html += `<p class="offline-intro">${escapeHtml(t("echoes.offline.unavailable"))}</p>`;
		$offlinePanel.innerHTML = html;
		return;
	}

	if (offline.preloading) {
		const pct = offline.total > 0 ? Math.round(100 * offline.done / offline.total) : 0;
		html += `<div class="offline-line">`
		     +    `<span class="lbl">${escapeHtml(t("echoes.offline.downloading"))}</span>`
		     +    `<span class="val">${pct}% &middot; ${offline.done} / ${offline.total}</span>`
		     + `</div>`;
		html += `<div class="offline-progress"><div class="offline-progress-bar" style="width:${pct}%"></div></div>`;
		html += `<div class="offline-actions">`
		     +    `<button class="offline-btn offline-btn--ghost" data-offline-action="cancel">${escapeHtml(t("echoes.offline.cancel"))}</button>`
		     + `</div>`;
	} else if (offline.enabled) {
		html += `<p class="offline-intro">${escapeHtml(allGood ? t("echoes.offline.ready") : t("echoes.offline.needs-sync"))}</p>`;
		if (storageNeeded) {
			html += `<div class="offline-line">`
			     +    `<span class="lbl">${escapeHtml(t("echoes.offline.storage"))}</span>`
			     +    `<span class="val">${escapeHtml(storageNeeded)}</span>`
			     + `</div>`;
		}
		html += `<div class="offline-line">`
		     +    `<span class="lbl">${escapeHtml(t("echoes.offline.cached"))}</span>`
		     +    `<span class="val ${allGood ? "ok" : "warn"}">${cached} / ${items.length}</span>`
		     + `</div>`;
		html += `<div class="offline-actions">`;
		if (!allGood) {
			html += `<button class="offline-btn" data-offline-action="resync">${escapeHtml(t("echoes.offline.resync"))}</button>`;
		}
		html += `<button class="offline-btn offline-btn--ghost" data-offline-action="disable">${escapeHtml(t("echoes.offline.disable"))}</button>`;
		html += `</div>`;
	} else {
		html += `<p class="offline-intro">${escapeHtml(t("echoes.offline.intro"))}</p>`;
		html += `<div class="offline-line">`
		     +    `<span class="lbl">${escapeHtml(t("echoes.offline.items"))}</span>`
		     +    `<span class="val">${items.length}</span>`
		     + `</div>`;
		if (storageNeeded) {
			html += `<div class="offline-line">`
			     +    `<span class="lbl">${escapeHtml(t("echoes.offline.storage"))}</span>`
			     +    `<span class="val">${escapeHtml(storageNeeded)}</span>`
			     + `</div>`;
		}
		if (offline.cacheState) {
			html += `<div class="offline-line">`
			     +    `<span class="lbl">${escapeHtml(t("echoes.offline.cached"))}</span>`
			     +    `<span class="val">${cached} / ${items.length}</span>`
			     + `</div>`;
		}
		html += `<div class="offline-actions">`
		     +    `<button class="offline-btn" data-offline-action="enable">${escapeHtml(t("echoes.offline.enable"))}</button>`
		     + `</div>`;
	}
	$offlinePanel.innerHTML = html;
}

async function serviceWorkerTarget(){
	if (!("serviceWorker" in navigator)) return null;
	if (navigator.serviceWorker.controller) return navigator.serviceWorker.controller;
	try {
		const reg = await navigator.serviceWorker.ready;
		return reg.active || null;
	} catch (e) {
		return null;
	}
}

async function postToServiceWorker(message, timeoutMs){
	const target = await serviceWorkerTarget();
	if (!target) throw new Error("no service worker");
	return await new Promise((resolve, reject) => {
		const channel = new MessageChannel();
		const timer = setTimeout(() => {
			try { channel.port1.close(); } catch (e) {}
			reject(new Error("service worker timeout"));
		}, timeoutMs || 8000);
		channel.port1.onmessage = (ev) => {
			clearTimeout(timer);
			resolve(ev.data);
		};
		target.postMessage(message, [channel.port2]);
	});
}

async function refreshOfflineState(){
	if (!$offlinePanel || !TRACKS.length) return;
	renderOfflinePanel();
	try {
		offline.cacheState = await postToServiceWorker({
			type: "getCacheState",
			items: buildOfflineItems(),
		});
	} catch (e) {
		offline.cacheState = null;
	}
	renderOfflinePanel();
}

async function enableOfflineMusic(){
	saveOfflineMode(true);
	if (navigator.storage && navigator.storage.persist) {
		try { await navigator.storage.persist(); } catch (e) {}
	}
	startOfflinePreload();
}

async function disableOfflineMusic(){
	saveOfflineMode(false);
	await refreshOfflineState();
}

async function startOfflinePreload(){
	if (offline.preloading) return;
	const target = await serviceWorkerTarget();
	if (!target) {
		renderOfflinePanel();
		return;
	}
	offline.preloading = true;
	offline.done = 0;
	offline.total = 0;
	offline.doneBytes = 0;
	offline.totalBytes = 0;
	renderOfflinePanel();

	const channel = new MessageChannel();
	offline.channel = channel;
	channel.port1.onmessage = (ev) => {
		const msg = ev.data || {};
		if (msg.type === "preloadProgress") {
			offline.done = msg.done || 0;
			offline.total = msg.total || 0;
			offline.doneBytes = msg.doneBytes || 0;
			offline.totalBytes = msg.totalBytes || 0;
			renderOfflinePanel();
		} else if (msg.type === "preloadComplete") {
			offline.preloading = false;
			offline.channel = null;
			refreshOfflineState();
		}
	};
	target.postMessage({
		type: "preloadAll",
		items: buildOfflineItems(),
	}, [channel.port2]);
}

async function cancelOfflinePreload(){
	try {
		const target = await serviceWorkerTarget();
		if (target) target.postMessage({ type: "preloadCancel" });
	} catch (e) {}
}

function bindOfflinePanel(){
	if (!$offlinePanel) return;
	$offlinePanel.addEventListener("click", (ev) => {
		const btn = ev.target.closest("[data-offline-action]");
		if (!btn) return;
		const action = btn.dataset.offlineAction;
		if (action === "enable") enableOfflineMusic();
		else if (action === "disable") disableOfflineMusic();
		else if (action === "resync") startOfflinePreload();
		else if (action === "cancel") cancelOfflinePreload();
	});
	renderOfflinePanel();
}

async function bootOfflineIntegrityCheck(){
	if (!offline.enabled) return;
	await refreshOfflineState();
	if (missingOfflineCount() > 0 && navigator.onLine) startOfflinePreload();
}

function detectReachedChapter(){
	// Coarse fallback used when ink-position lookup can't resolve.
	// Returns 0 if there's no save (new visitor → minimal mode).
	try {
		const raw = localStorage.getItem("lirien.save");
		if (!raw) return 0;
		const saved = JSON.parse(raw);
		const bg = (saved && saved.bg) || "";
		const m = bg.match(/^ch(\d+)_/);
		if (m) return Math.max(1, parseInt(m[1], 10));
	} catch (e) { /* private mode / quota — ignore */ }
	return 0;
}

// Precise position: parse the main app's autosave for
// previousContentObject (e.g. "ch03_007b_joy.12") and resolve the
// containing knot to a test.ink line number via progressionData.
// Returns 0 on any failure — caller falls back to detectReachedChapter().
function detectUserInkLine(){
	if (!progressionData || !progressionData.knots) return 0;
	try {
		const raw = localStorage.getItem("lirien.save");
		if (!raw) return 0;
		const saved = JSON.parse(raw);
		// saved.state is a JSON string of the inkjs runtime state.
		const stateBlob = typeof saved.state === "string"
			? JSON.parse(saved.state)
			: saved.state;
		const flow = stateBlob && stateBlob.flows && stateBlob.flows.DEFAULT_FLOW;
		const threads = flow && flow.callstack && flow.callstack.threads;
		const lastThread = threads && threads[threads.length - 1];
		const prev = (lastThread && lastThread.previousContentObject) || "";
		// "ch03_007b_joy.12" → knot name "ch03_007b_joy"
		const knotName = prev.split(".")[0];
		if (!knotName) return 0;
		const line = progressionData.knots[knotName];
		return line || 0;
	} catch (e) {
		return 0;
	}
}

// Returns the set of track filenames the user has heard, given
// their current line in test.ink. Tracks not in progressionData are
// implicitly excluded (i.e. tracks that never play in the .ink).
function tracksHeardByLine(userLine){
	const heard = new Set();
	if (!progressionData || !progressionData.tracks || !userLine) return heard;
	for (const [trackFile, unlockLine] of Object.entries(progressionData.tracks)){
		if (unlockLine <= userLine) heard.add(trackFile);
	}
	return heard;
}

function visibleIndices(){
	// chapter is one of:
	//   number       — first chapter the track ACTUALLY PLAYS in the
	//                  .ink source. Used for the chapter-level
	//                  fallback when ink-position lookup fails.
	//   "unused"     — track exists as music + image but never plays
	//                  in the .ink. Show only in "all" mode.
	//   "minimal"    — the theme song (lirien_remembers). Always
	//                  surfaces — in minimal it's the ONLY track;
	//                  in played + all it's an always-available
	//                  anchor on top of the chapter set.
	const minimalIdxs = TRACKS
		.map((_, i) => i)
		.filter(i => TRACKS[i].chapter === "minimal");

	if (content === "minimal") return minimalIdxs;

	if (content === "all"){
		// Everything: numeric-chapter + "unused" + "minimal" anchor.
		return TRACKS.map((_, i) => i);
	}

	// "played": always include the theme song. Add heard tracks on top
	// (precise via ink position; coarse via chapter fallback only if
	// there's actually a save). No save = ONLY the theme song.
	const played = [...minimalIdxs];
	const userLine = detectUserInkLine();
	if (userLine > 0){
		const heard = tracksHeardByLine(userLine);
		TRACKS.forEach((t, i) => {
			if (t.chapter !== "minimal" && heard.has(t.file)) played.push(i);
		});
	} else {
		// Fallback chapter-level. Re-detect to distinguish "no save" (0)
		// from a save with progress — the global reachedChapter is
		// pinned to 1 even with no save (soft entry on toggle to
		// "played"), so it can't tell us "save vs no save" by itself.
		const detectedCh = detectReachedChapter();
		if (detectedCh > 0){
			TRACKS.forEach((t, i) => {
				if (typeof t.chapter === "number" && t.chapter <= detectedCh) played.push(i);
			});
		}
	}
	return played;
}

// ─────────────────────────────────────────────────────────────────
// Deterministic shuffle, persisted for the session.
//
// "Session OR day, whichever comes first" semantics:
//   - sessionStorage is naturally cleared when the tab closes →
//     fresh shuffle next visit, regardless of date.
//   - We also stamp the queue with the current local date; if the
//     stored date no longer matches today (left a tab open across
//     midnight), we regenerate.
//
// Within a session, the queue is GENERATED ONCE per (content mode,
// visible-set fingerprint) and looped. Exhausting it doesn't
// re-shuffle — it wraps back to the start. That makes "previous"
// always step backward through a stable, predictable order.
// ─────────────────────────────────────────────────────────────────
// Persistence in localStorage (was sessionStorage, which died on
// tab close). The blob now survives reloads and PWA cold-starts.
//   • mode / content / activeIdx — settings; never expire.
//   • shuffledAt + fingerprint + queue + queueIdx — the queue
//     order; valid for QUEUE_TTL_MS, then regenerated.
const STATE_STORAGE_KEY = "lirien.jukebox.state";
const QUEUE_TTL_MS = 24 * 60 * 60 * 1000;

// A short fingerprint of the visible set — sorted, comma-joined indices.
// If the visible set changes (content mode toggled), the fingerprint
// changes and we regenerate the queue rather than using a stale order.
function visibleFingerprint(){
	return visibleIndices().slice().sort((a,b) => a-b).join(",");
}

function loadStoredState(){
	try {
		const raw = localStorage.getItem(STATE_STORAGE_KEY);
		return raw ? JSON.parse(raw) : null;
	} catch (e) { return null; }
}

// Returns the persisted blob if its queue is still valid (under TTL
// + fingerprint matches). Settings-only fields (mode/content/activeIdx)
// are read separately via loadStoredState; this gate only protects
// the queue-order fields.
function loadStoredQueue(){
	const state = loadStoredState();
	if (!state) return null;
	if (typeof state.shuffledAt !== "number") return null;
	if (Date.now() - state.shuffledAt > QUEUE_TTL_MS) return null;
	if (state.fingerprint !== visibleFingerprint()) return null;
	if (!Array.isArray(state.queue)) return null;
	return state;
}

// Persist current settings + queue. `extra` lets the caller override
// individual fields (e.g. reshuffle passes {shuffledAt: Date.now()}
// when it generates a fresh queue).
function persistState(extra){
	try {
		const cur = loadStoredState() || {};
		const next = Object.assign({}, cur, {
			mode, content, activeIdx,
			queue: queue.slice(),
			queueIdx,
			fingerprint: visibleFingerprint(),
		}, extra || {});
		localStorage.setItem(STATE_STORAGE_KEY, JSON.stringify(next));
	} catch (e) { /* private mode / quota — silent */ }
}

// Back-compat alias: existing callers say persistQueue(). The new
// name persistState() is more accurate but the call-sites are fine.
const persistQueue = persistState;

// URL parameter parsing — share-link support. Examples:
//   /echoes/?mode=repeat
//   /echoes/?song=field_becomes_visible
//   /echoes/?mode=sequential&song=ash_plains
// The slug for `song` is the track's file name minus its audio
// extension (.m4a / .mp3 / .ogg / .wav).
function parseUrlParams(){
	try {
		const params = new URLSearchParams(window.location.search);
		return {
			mode: params.get("mode"),
			song: params.get("song"),
		};
	} catch (e) { return { mode: null, song: null }; }
}

function trackSlug(track){
	if (!track || !track.file) return "";
	return String(track.file).replace(/\.(m4a|mp3|ogg|wav)$/i, "");
}

function findTrackBySlug(slug){
	if (!slug) return -1;
	const want = String(slug).toLowerCase();
	for (let i = 0; i < TRACKS.length; i++){
		if (trackSlug(TRACKS[i]).toLowerCase() === want) return i;
	}
	return -1;
}

function reshuffle(skipFirst){
	// Try to restore an in-progress queue first. The restored queue
	// is only valid if it's fresh (< QUEUE_TTL_MS), visible set + mode
	// match, and the queue is non-empty. Mode matters because
	// shuffled and sequential produce different orders and we don't
	// want to display the wrong one.
	const restored = loadStoredQueue();
	if (restored && restored.mode === mode && Array.isArray(restored.queue) && restored.queue.length){
		queue = restored.queue;
		queueIdx = (typeof restored.queueIdx === "number") ? restored.queueIdx : -1;
		return;
	}
	const idx = visibleIndices();
	if (mode === "shuffled"){
		for (let i=idx.length-1;i>0;i--){
			const j = Math.floor(Math.random()*(i+1));
			[idx[i],idx[j]] = [idx[j],idx[i]];
		}
		// Avoid landing the freshly-shuffled queue's first element on
		// the track that just finished (otherwise back-to-back same
		// track on shuffle wraparound).
		if (skipFirst != null && idx.length > 1 && idx[0] === skipFirst){
			[idx[0],idx[1]] = [idx[1],idx[0]];
		}
	}
	// Sequential and repeat modes: leave idx in visibleIndices order.
	// For sequential that IS the play order; for repeat the queue
	// order only matters for explicit prev/next navigation since
	// the audio element loops the current track on its own.
	queue = idx;
	// If a track is currently active, sync queueIdx to its position
	// in the new queue so next/previous work coherently after a
	// mode toggle.
	if (activeIdx !== -1){
		const pos = queue.indexOf(activeIdx);
		queueIdx = (pos !== -1) ? pos : -1;
	} else {
		queueIdx = -1;
	}
	// Mark this as a fresh shuffle moment — the 24h TTL gate in
	// loadStoredQueue() reads `shuffledAt` to decide whether to
	// reuse the queue on the next page load.
	persistState({ shuffledAt: Date.now() });
}

function nextIndex(){
	if (mode === "sequential" || mode === "repeat"){
		// Repeat mode handles auto-loop via $audio.loop=true, so this
		// path only fires on explicit next-button presses or drawer
		// taps that route through here. In both, "next" means the
		// next visible track — same behaviour as sequential. Once
		// the user lands there, the loop attribute keeps it playing.
		const visible = visibleIndices();
		if (!visible.length) return null;
		const pos = visible.indexOf(activeIdx);
		if (pos === -1) return visible[0];
		return visible[(pos + 1) % visible.length];
	}
	// shuffled — wrap through the same fixed queue rather than
	// re-shuffling. Deterministic for the session.
	queueIdx = (queueIdx + 1) % queue.length;
	persistQueue();
	return queue[queueIdx];
}

function previousQueueIndex(){
	if (mode === "sequential" || mode === "repeat"){
		const visible = visibleIndices();
		if (!visible.length) return null;
		const pos = visible.indexOf(activeIdx);
		if (pos === -1) return visible[visible.length - 1];
		return visible[(pos - 1 + visible.length) % visible.length];
	}
	// shuffled — step back one in the fixed queue, wrapping if
	// we're at the start.
	queueIdx = (queueIdx - 1 + queue.length) % queue.length;
	persistQueue();
	return queue[queueIdx];
}

function toggleMode(){
	const order = ["shuffled", "sequential", "repeat"];
	mode = order[(order.indexOf(mode) + 1) % order.length];
	// Regenerate the queue on mode change. shuffled and sequential
	// produce different orders; repeat preserves the current
	// order (reshuffle treats repeat like sequential = visible
	// order in TRACKS sequence). The drawer renders the queue
	// directly so it must match what's actually about to play.
	reshuffle(activeIdx);
	// In repeat mode the audio element loops the current track;
	// flip $audio.loop now so the change takes effect on the
	// currently-playing track without waiting for a track switch.
	applyRepeatLoop();
	updateModeLabel();
	buildTracklist();
	updateActiveRow();
	if (typeof refreshDrawerSettingsState === "function") refreshDrawerSettingsState();
}

function applyRepeatLoop(){
	// Repeat mode forces audio.loop=true regardless of per-track
	// loop config. Other modes restore the original (only Lirien
	// Remembers in minimal mode is loop:true; everything else is
	// loop:false so it yields to next() on `ended`).
	if (!$audio) return;
	if (mode === "repeat"){
		$audio.loop = true;
	} else if (activeIdx >= 0 && TRACKS[activeIdx]){
		const track = TRACKS[activeIdx];
		// In repeat mode the audio element loops the active track so
	// it plays indefinitely. In other modes the per-track loop
	// flag only applies in minimal mode (Lirien Remembers seamless).
	$audio.loop = (mode === "repeat") || (!!track.loop && content === "minimal");
	} else {
		$audio.loop = false;
	}
}

function updateModeLabel(){
	$modeValue.textContent = (window.lirienT && window.lirienT("echoes.mode." + mode)) || mode;
	// aria-pressed is binary; mark as "pressed" whenever we're in
	// any non-default mode so screen readers can convey "the
	// toggle is doing something other than the default."
	$modeToggle.setAttribute("aria-pressed", mode !== "shuffled" ? "true" : "false");
}

function toggleContent(){
	const order = ["played", "all", "minimal"];
	content = order[(order.indexOf(content) + 1) % order.length];
	updateContentLabel();
	updateCounts();
	// Rebuild queue against the new visibility. Currently-playing
	// track keeps playing even if it's no longer in the visible set —
	// when it ends we'll move to the next visible track. The user
	// just sees the drawer + brand-meta change.
	reshuffle(activeIdx);
	buildTracklist();
	updateActiveRow();
	// Refresh the bg. setBg() reads `content` and uses the hero
	// image automatically when minimal, so we just hand it whichever
	// per-track image is most relevant — current track if loaded,
	// else the first queued track, else any track (it'll get
	// ignored by minimal anyway).
	const imageSource =
		activeIdx >= 0          ? TRACKS[activeIdx].image :
		queue.length > 0        ? TRACKS[queue[0]].image :
		TRACKS[0]               ? TRACKS[0].image :
		"";
	setBg(imageSource);
	applyCaptionForCurrent();
	if (typeof refreshDrawerSettingsState === "function") refreshDrawerSettingsState();
}

function updateContentLabel(){
	$contentValue.textContent = (window.lirienT && window.lirienT("echoes.content." + content)) || content;
}

// Resolve a track's caption in the current language. Track titles
// stay English universally (they're proper-noun song titles like
// "Ash Plains" / "Thistle's Theme" — translating would feel as
// wrong as translating "Bohemian Rhapsody"). Captions DO translate
// — they're descriptive subtitles ("Chapter Three — the threshold")
// and the Spanish locale needs them in Spanish to feel coherent.
function currentLang(){
	return (document.documentElement && document.documentElement.lang) || "en";
}
function captionFor(track, lang){
	if (!track) return "";
	if (lang !== "en"){
		const localized = track["caption_" + lang];
		if (localized) return localized;
	}
	return track.caption || "";
}
// Single source of truth for what the title/caption block shows.
// When no track is active, render the i18n defaults; when one is,
// render the track's title (always English) + captionFor() in the
// current locale. Called on track change and on language switch.
function renderTrackInfo(){
	const lang = currentLang();
	if (activeIdx < 0){
		$trackTitle.textContent =
			(window.lirienT && window.lirienT("echoes.title.default")) || "A small room of music";
		$trackCaption.textContent =
			(window.lirienT && window.lirienT("echoes.caption.default")) || "Touch the spiral to begin";
		return;
	}
	const t = TRACKS[activeIdx];
	$trackTitle.textContent = t.title || "";
	$trackCaption.textContent = captionFor(t, lang);
}

function applyCaptionForCurrent(){
	if (activeIdx < 0) return;
	$trackCaption.textContent = captionFor(TRACKS[activeIdx], currentLang());
}

// (Old previousIndex via history removed — deterministic queue
//  walks back via previousQueueIndex() above.)

// ─────────────────────────────────────────────────────────────────
// Loading + playback
// ─────────────────────────────────────────────────────────────────
function setBg(imageFile){
	// In minimal mode the bg is locked to the wide Solrien vista
	// (already on the landing page, non-spoilery). For chapter
	// modes, resolve the per-track image; if it's an empty string
	// we fall back to the same vista.
	let url;
	if (content === "minimal"){
		url = HERO_BG_PATH;
	} else if (!imageFile){
		url = HERO_BG_PATH;
	} else if (imageFile.startsWith("../")){
		url = webpImageUrl(imageFile);
	} else {
		url = ATMOS_BASE + webpImageUrl(imageFile);
	}
	const incoming = activeBg === "a" ? $bgB : $bgA;
	const outgoing = activeBg === "a" ? $bgA : $bgB;
	incoming.style.backgroundImage = `url("${url}")`;
	// double-RAF so the transition fires after the background-image
	// has had a chance to layout in some engines
	requestAnimationFrame(()=>requestAnimationFrame(()=>{
		incoming.classList.add("is-active");
		outgoing.classList.remove("is-active");
		activeBg = activeBg === "a" ? "b" : "a";
	}));
}

function loadTrack(idx, opts){
	opts = opts || {};
	if (idx == null || idx < 0 || idx >= TRACKS.length) return;
	const track = TRACKS[idx];
	activeIdx = idx;
	// Sync queueIdx so the deterministic queue's notion of "current"
	// matches the track that's actually playing — covers the case
	// where the user picked a track from the drawer instead of
	// using next/previous.
	const queuePos = queue.indexOf(idx);
	if (queuePos !== -1){
		queueIdx = queuePos;
	}
	// Persist regardless of queuePos: if the track isn't in the
	// current queue (e.g. user landed via ?song= for a track from
	// outside the visible content mode), activeIdx still needs to
	// survive a reload.
	persistState();

	// fade text out, then update + fade in
	$trackInfo.classList.add("is-fading");
	$spiralWrap.classList.add("is-changing");
	setTimeout(()=>{
		$trackTitle.textContent = track.title;
		$trackCaption.textContent = captionFor(track, currentLang());
		$trackInfo.classList.remove("is-fading");
	}, 350);
	setTimeout(()=>$spiralWrap.classList.remove("is-changing"), 1000);

	setBg(track.image);
	updateActiveRow();

	$audio.src = trackAudioUrl(track);
	// Per-track loop flag, but only honoured in minimal mode. Lirien
	// Remembers carries loop:true so it loops cleanly without a tiny
	// gap on the `ended` → next() roundtrip when it's the sole queue
	// entry. In played/all it sits in the rotation like any other
	// track and must yield to next() on `ended`.
	// In repeat mode the audio element loops the active track so
	// it plays indefinitely. In other modes the per-track loop
	// flag only applies in minimal mode (Lirien Remembers seamless).
	$audio.loop = (mode === "repeat") || (!!track.loop && content === "minimal");
	// New track means new "ahead-of" reference point — clear the
	// prefetch markers so the next 2 (relative to the new position)
	// can be queued up when we hit 80% again.
	resetPrefetchMarkers();
	if (opts.play !== false){
		const p = $audio.play();
		if (p && p.catch) p.catch(()=>{ /* autoplay may block; silent */ });
	}
}

function reloadActiveTrackAndPlay(position){
	if (activeIdx < 0 || !TRACKS[activeIdx]) return;
	const resumeAt = Number.isFinite(position) ? Math.max(0, position) : 0;
	loadTrack(activeIdx, {play:false});
	const start = () => {
		$audio.removeEventListener("loadedmetadata", start);
		$audio.removeEventListener("canplay", start);
		try {
			if (resumeAt > 0 && $audio.duration && isFinite($audio.duration)) {
				$audio.currentTime = Math.min(resumeAt, Math.max(0, $audio.duration - 0.25));
			}
		} catch (e) { /* Safari may reject early seeks; play anyway */ }
		const p = $audio.play();
		if (p && p.catch) p.catch(()=>{ /* user may need in-app gesture */ });
	};
	if ($audio.readyState >= 1) start();
	else {
		$audio.addEventListener("loadedmetadata", start, {once:true});
		$audio.addEventListener("canplay", start, {once:true});
		try { $audio.load(); } catch (e) {}
	}
}

let nativeResumeWatchdogToken = 0;
function armNativeResumeWatchdog(startTime){
	const token = ++nativeResumeWatchdogToken;
	const check = () => {
		if (token !== nativeResumeWatchdogToken) return;
		if (activeIdx < 0 || !TRACKS[activeIdx]) return;
		if ($audio.ended) return;
		const now = Number.isFinite($audio.currentTime) ? $audio.currentTime : 0;
		// Native iOS controls can report "playing" after an external
		// pause while the media clock is actually stuck. If the clock
		// has not moved after a short grace period, rebuild the current
		// audio source and resume near the same timestamp.
		if ($audio.paused || now <= startTime + 0.15) {
			nativeResumeWatchdogToken += 1;
			reloadActiveTrackAndPlay(now > 0 ? now : startTime);
		}
	};
	setTimeout(check, 1800);
	setTimeout(check, 3600);
}

function play(opts){
	opts = opts || {};
	if (activeIdx < 0){
		loadTrack(nextIndex(), {play:true});
		return;
	}
	const track = TRACKS[activeIdx];
	// Fast path: no src or audio errored — full reload from scratch.
	if (track && (!$audio.src || $audio.src === "" || $audio.error)){
		loadTrack(activeIdx, {play:true});
		return;
	}
	// DON'T set mediaSession.playbackState optimistically here.
	// Steve's report 2026-05-11: on iOS after audio-focus loss,
	// $audio.play() resolves (no rejection) but produces no sound;
	// an optimistic "playing" state painted the lock-screen icon
	// as playing while the speaker stayed silent. playbackState is
	// now set ONLY from the real audio 'play' / 'pause' events
	// below, so the lock-screen icon always reflects truth.
	const startTime = Number.isFinite($audio.currentTime) ? $audio.currentTime : 0;
	const p = $audio.play();
	if (opts.recoverNative) armNativeResumeWatchdog(startTime);
	if (p && p.catch){
		// If play() rejects outright (the most reliable failure
		// signal), reload the track from scratch — that's the
		// same path our first-gesture flow uses, and iOS is more
		// likely to re-acquire audio session focus from a fresh
		// load than from a bare retry. We don't try to preserve
		// currentTime here: getting audio back at all matters
		// more than position when iOS has interrupted us.
		p.catch(()=>{
			try { reloadActiveTrackAndPlay(startTime); } catch (e) {}
		});
	}
}

function pause(){ $audio.pause(); }
function togglePlay(){ $audio.paused ? play() : pause(); }

function next(){ loadTrack(nextIndex(), {play:!$audio.paused}); }

// Smart back: convention from Spotify / Apple Music — if we're
// more than 3s into the current track, "back" restarts the
// current track; otherwise it goes to the previous track in
// the queue.
const PREVIOUS_RESTART_THRESHOLD_S = 3;
function previous(){
	if ($audio.currentTime > PREVIOUS_RESTART_THRESHOLD_S){
		$audio.currentTime = 0;
		// Drive the bar fill immediately — paused timeupdate is lazy.
		$progressFill.style.width = "0%";
		return;
	}
	const idx = previousQueueIndex();
	if (idx == null){ $audio.currentTime = 0; return; }
	loadTrack(idx, {play:!$audio.paused});
}

// ─────────────────────────────────────────────────────────────────
// Audio events drive UI state
// ─────────────────────────────────────────────────────────────────
$audio.addEventListener("play",  ()=>{
	started = true;
	document.body.classList.remove("is-paused");
	document.body.classList.add("is-playing");
	$playBtn.setAttribute("aria-label","Pause");
	$spiralBtn.setAttribute("aria-pressed","true");
	$invitation.classList.add("is-hidden");
	updateMediaSessionMeta();
	// Tell the OS our playback state so the lock-screen control
	// renders the correct icon and our action handler stays
	// registered for the "playing" state.
	if ("mediaSession" in navigator) {
		try { navigator.mediaSession.playbackState = "playing"; } catch (e) {}
	}
});
$audio.addEventListener("pause", ()=>{
	document.body.classList.remove("is-playing");
	document.body.classList.add("is-paused");
	$playBtn.setAttribute("aria-label","Play");
	$spiralBtn.setAttribute("aria-pressed","false");
	// Bring the invitation italic back when playback pauses —
	// keeps the layout symmetric (seekbar glides up, invitation
	// fades back in to fill the empty slot above the transport).
	// CSS transition handles the fade.
	$invitation.classList.remove("is-hidden");
	if ("mediaSession" in navigator) {
		try { navigator.mediaSession.playbackState = "paused"; } catch (e) {}
	}
});
$audio.addEventListener("ended", ()=>{
	// `paused` flips to true the instant a track ends naturally, so
	// passing through next() (which preserves play/pause state) would
	// stop the queue. The user-visible contract is "the spiral plays
	// until you press it to stop" — so on natural end, force-continue.
	loadTrack(nextIndex(), {play:true});
});
$audio.addEventListener("error", ()=>{
	// Move past a bad file — never get stuck on a single track. Use
	// `started` (not !$audio.paused) because an errored audio reads
	// paused=true, which would otherwise stop the queue dead.
	console.warn("[jukebox] audio error, advancing", $audio.error, $audio.src);
	setTimeout(()=>loadTrack(nextIndex(), {play: started}), 500);
});
$audio.addEventListener("timeupdate", ()=>{
	if (!$audio.duration || !isFinite($audio.duration)) return;
	const pct = ($audio.currentTime / $audio.duration) * 100;
	$progressFill.style.width = pct.toFixed(2) + "%";
	$progress.setAttribute("aria-valuenow", pct.toFixed(0));
	// Once we're 80% through the current track, prefetch the next 2
	// tracks' audio + image so the swap is instant when the current
	// one ends. Non-greedy: never more than 2 ahead, never re-fetched
	// once cached. The browser cache (and the service worker, when
	// it lands) hold them across track changes.
	if (pct >= 80) maybePrefetchAhead();
});

// ─────────────────────────────────────────────────────────────────
// Predictive preload — non-greedy.
//
// Two tracks ahead is the whole budget. Each track's audio + image
// is fetched once (browser cache holds the rest) and we mark which
// queue indices we've already prefetched so we don't re-fire on
// every timeupdate tick.
// ─────────────────────────────────────────────────────────────────
const prefetchedQueueIdx = new Set();
function maybePrefetchAhead(){
	if (!queue.length) return;
	for (let ahead = 1; ahead <= 2; ahead++){
		const peekIdx = (queueIdx + ahead) % queue.length;
		if (prefetchedQueueIdx.has(peekIdx)) continue;
		const trackIdx = queue[peekIdx];
		const track = TRACKS[trackIdx];
		if (!track) continue;
		// Image: an Image() object's src triggers a fetch the browser
		// then keeps in its image cache; subsequent <img>/background-
		// image references reuse the same cached entry.
		if (track.image){
			const img = new Image();
			img.src = trackImageUrl(track);
		}
		// Audio: a separate Audio() with preload="auto" warms the
		// browser's media cache for the track. We deliberately don't
		// call .play() — just letting the file download.
		if (track.file){
			const a = new Audio();
			a.preload = "auto";
			a.src = trackAudioUrl(track);
		}
		prefetchedQueueIdx.add(peekIdx);
	}
}
// On each track change, drop prefetch markers for queue indices that
// are no longer "ahead" of the current position so they get re-prefetched
// later in the loop. (The browser cache still holds the bytes, so this
// is cheap — it's just our internal "should we kick fetches off again"
// state.)
function resetPrefetchMarkers(){
	prefetchedQueueIdx.clear();
}

// ─────────────────────────────────────────────────────────────────
// Controls
// ─────────────────────────────────────────────────────────────────
// Brief glow-then-fade acknowledgment on tap. Touch devices used
// to keep the :hover-state glow stuck on the button after a tap
// (iOS sticky-hover bug); we now gate :hover behind (hover:hover)
// so it only fires on real hover devices, and apply this short
// animation class on click so touch users still get visible
// feedback. animationend self-removes the class so successive
// taps re-trigger the animation.
function ackTap(el){
	if (!el) return;
	el.classList.remove("tap-ack");
	void el.offsetWidth;  /* force reflow so animation re-fires */
	el.classList.add("tap-ack");
}
function bindTapAck(el){
	if (!el) return;
	el.addEventListener("animationend", (e)=>{
		if (e.animationName && e.animationName.endsWith("-tap-ack")){
			el.classList.remove("tap-ack");
		}
	});
}
[$spiralBtn,$playBtn,$prevBtn,$nextBtn,$listBtn].forEach(bindTapAck);

$spiralBtn.addEventListener("click", ()=>{
	ackTap($spiralBtn);
	if (!started){ play(); return; }
	togglePlay();
});
$playBtn.addEventListener("click", ()=>{
	ackTap($playBtn);
	if (!started){ play(); return; }
	togglePlay();
});
$prevBtn.addEventListener("click", ()=>{ ackTap($prevBtn); previous(); });
$nextBtn.addEventListener("click", ()=>{ ackTap($nextBtn); next(); });
$modeToggle.addEventListener("click", toggleMode);
$contentToggle.addEventListener("click", toggleContent);

// Drag / tap to seek. Pointer events cover mouse, touch, and pen in
// a single path. We bind move/up to *document* once a drag begins —
// not to the bar — so the drag stays alive regardless of whether
// the finger drifts off the 18px slider. iOS Safari is unreliable
// about routing pointermove back to the originating element via
// setPointerCapture on thin touch targets; document-level listeners
// always receive the moves.
let seekDragging = false;
let seekPointerId = null;

function clientXFromPointer(ev){
	return ev.clientX !== undefined ? ev.clientX :
	       (ev.touches && ev.touches[0] ? ev.touches[0].clientX : 0);
}
function applySeek(clientX){
	if (!$audio.duration || !isFinite($audio.duration)) return;
	const rect = $progress.getBoundingClientRect();
	const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
	$audio.currentTime = ratio * $audio.duration;
	// Drive the bar fill immediately — timeupdate may not fire
	// instantly while the audio engine resyncs, especially during
	// continuous drag or while paused.
	$progressFill.style.width = (ratio*100).toFixed(2) + "%";
	$progress.setAttribute("aria-valuenow", (ratio*100).toFixed(0));
}

function onSeekMove(ev){
	if (!seekDragging) return;
	// If we tracked a specific pointer (multi-touch case), ignore
	// other pointers' moves.
	if (seekPointerId !== null && ev.pointerId !== seekPointerId) return;
	applySeek(clientXFromPointer(ev));
	ev.preventDefault();
}
function onSeekEnd(ev){
	if (!seekDragging) return;
	if (seekPointerId !== null && ev.pointerId !== seekPointerId) return;
	seekDragging = false;
	seekPointerId = null;
	document.removeEventListener("pointermove", onSeekMove);
	document.removeEventListener("pointerup",   onSeekEnd);
	document.removeEventListener("pointercancel", onSeekEnd);
}

$progress.addEventListener("pointerdown", (ev) => {
	if (!$audio.duration || !isFinite($audio.duration)) return;
	seekDragging = true;
	seekPointerId = ev.pointerId;
	applySeek(clientXFromPointer(ev));
	ev.preventDefault();
	// Document-level so the drag persists outside the bar's bounds.
	// passive:false so we can preventDefault during a move (iOS
	// would otherwise interpret the move as a page-scroll gesture).
	document.addEventListener("pointermove", onSeekMove, { passive: false });
	document.addEventListener("pointerup",   onSeekEnd);
	document.addEventListener("pointercancel", onSeekEnd);
});

$progress.addEventListener("keydown", (ev)=>{
	// Arrow keys when the bar has focus seek by ±5%.
	if (!$audio.duration || !isFinite($audio.duration)) return;
	if (ev.code === "ArrowLeft" || ev.code === "ArrowRight"){
		ev.preventDefault();
		const delta = (ev.code === "ArrowRight" ? 1 : -1) * 0.05;
		const ratio = Math.max(0, Math.min(1, ($audio.currentTime / $audio.duration) + delta));
		$audio.currentTime = ratio * $audio.duration;
	}
});

// ─────────────────────────────────────────────────────────────────
// Media Session — controls in the OS lock screen, AirPods, watch,
// car CarPlay, the iOS now-playing widget, etc. Without this, when
// the user backgrounds the tab or PWA, their playback controls
// just say the page title. With this, they see the actual track
// title + caption + spiral artwork and can play/pause/skip from
// hardware controls.
// ─────────────────────────────────────────────────────────────────
// Register MediaSession action handlers once at module load. iOS
// is more reliable about delivering lock-screen taps when the
// handlers are bound BEFORE the first play event — registering
// inside updateMediaSessionMeta (which only fires on play) left a
// window where the OS didn't trust our session yet. Idempotent;
// re-calling setActionHandler with the same fn just replaces it.
(function registerMediaSessionHandlers(){
	// Audio Session API (W3C draft, Safari iOS 17+). Setting
	// type="playback" explicitly requests iOS's
	// AVAudioSessionCategoryPlayback — the same category native
	// music apps use. This is what should let the audio session
	// survive long pauses and continue to honor lock-screen action
	// handlers without the well-known ~30-second-pause window
	// (Apple Developer Forum thread 762582 / WebKit bug 261858).
	// Limited availability across browsers; safe no-op elsewhere.
	if ("audioSession" in navigator){
		try { navigator.audioSession.type = "playback"; } catch (e) {}
	}
	if (!("mediaSession" in navigator)) return;
	try {
		navigator.mediaSession.setActionHandler("play",         () => {
			if ("audioSession" in navigator){
				try { navigator.audioSession.type = "playback"; } catch (e) {}
			}
			play({recoverNative:true});
		});
		navigator.mediaSession.setActionHandler("pause",        () => pause());
		navigator.mediaSession.setActionHandler("nexttrack",    () => next());
		navigator.mediaSession.setActionHandler("previoustrack",() => previous());
	} catch (e) { /* not all browsers support every action */ }

	// Native iOS app: the StreamingAudio plugin owns the lock-screen
	// controls. It fires synthetic remote events on $audio so the in-
	// app UI stays in sync and next/previous get routed back here.
	if ($audio && $audio.isNative && typeof $audio.addEventListener === "function") {
		$audio.addEventListener("remotenext", () => next());
		$audio.addEventListener("remoteprevious", () => previous());
	}
})();

function updateMediaSessionMeta(){
	if (activeIdx < 0) return;
	const track = TRACKS[activeIdx];
	if ("mediaSession" in navigator) {
		try {
			navigator.mediaSession.metadata = new MediaMetadata({
				title: track.title || "",
				artist: "Chronicles of Lirien",
				album: "The Spiral That Remembers",
				artwork: [
					{ src: "icon-192-v3.png",  sizes: "192x192", type: "image/png" },
					{ src: "icon-512-v3.png",  sizes: "512x512", type: "image/png" }
				]
			});
		} catch (e) { /* silent */ }
	}
	// Native iOS app: also push to the lock-screen / Control Center
	// Now Playing widget via the StreamingAudio plugin. mediaSession
	// alone doesn't bridge to AVPlayer-driven audio, so we mirror the
	// metadata into MPNowPlayingInfoCenter explicitly.
	if ($audio && $audio.setNowPlayingInfo) {
		const artworkUrl = trackImageUrl(track);
		$audio.setNowPlayingInfo({
			title: track.title || "",
			artist: "Chronicles of Lirien",
			album: "The Spiral That Remembers",
			duration: ($audio.duration && isFinite($audio.duration)) ? $audio.duration : 0,
			artwork: artworkUrl ? new URL(artworkUrl, location.href).href : ""
		});
	}
}

// keyboard (global). Arrow keys on the focused progress bar mean
// "seek" — handled by the slider's own listener — so we skip them
// here when the bar has focus.
document.addEventListener("keydown", (ev)=>{
	if (ev.target && /^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
	const onSlider = ev.target === $progress;
	if (ev.code === "Space"){ ev.preventDefault(); $spiralBtn.click(); }
	else if (ev.code === "ArrowRight" && !onSlider) next();
	else if (ev.code === "ArrowLeft"  && !onSlider) previous();
	else if (ev.code === "Escape" && $drawer.classList.contains("is-open")) closeDrawer();
});

// ─────────────────────────────────────────────────────────────────
// Drawer + track list
// ─────────────────────────────────────────────────────────────────
function buildTracklist(){
	// Render in actual play order. queue is already in the right
	// sequence: sequential mode = visibleIndices order; shuffled =
	// the deterministic shuffled order. Either way, the user's
	// drawer matches what's about to play.
	const frag = document.createDocumentFragment();
	queue.forEach((trackIdx, queuePos) => {
		const t = TRACKS[trackIdx];
		if (!t) return;
		const li = document.createElement("li");
		const btn = document.createElement("button");
		btn.type = "button";
		btn.className = "track-row";
		btn.dataset.idx = String(trackIdx);
		const where = captionFor(t, currentLang());
		btn.innerHTML = `
			<span class="num">${String(queuePos+1).padStart(2,"0")}</span>
			<span class="meta">
				<span class="name">${escapeHtml(t.title)}</span>
				<span class="where">${escapeHtml(where)}</span>
			</span>`;
		btn.addEventListener("click", ()=>{
			loadTrack(trackIdx, {play:true});
			closeDrawer();
		});
		li.appendChild(btn);
		frag.appendChild(li);
	});
	$tracklist.innerHTML = "";
	$tracklist.appendChild(frag);
}
function updateActiveRow(){
	$tracklist.querySelectorAll(".track-row").forEach((row)=>{
		row.classList.toggle("is-active", Number(row.dataset.idx) === activeIdx);
	});
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, (c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function updateDrawerScrollHint(){
	if (!$drawer) return;
	const body = $drawer.querySelector(".drawer-body");
	if (!body) return;
	const hasMore = body.scrollTop + body.clientHeight < body.scrollHeight - 2;
	$drawer.classList.toggle("has-scroll-more", hasMore);
}

function openDrawer(){
	$drawer.classList.add("is-open");
	$drawerScrim.classList.add("is-open");
	$drawer.setAttribute("aria-hidden","false");
	$drawerScrim.setAttribute("aria-hidden","false");
	refreshOfflineState();
	// {preventScroll:true} so focus() doesn't yank the drawer's
	// scroll back to the top of the list — we want the active
	// row centered, not the close button visible.
	$drawerClose.focus({preventScroll:true});
	// Center the currently-playing row in the drawer's scroll
	// viewport. Useful on mobile (especially landscape) where the
	// list is taller than the screen and the active row is often
	// off-screen by default. Runs after open so layout is settled.
	requestAnimationFrame(scrollActiveTrackIntoView);
	// Make sure the settings rows reflect the current state every
	// time the drawer opens — guards against external state changes
	// (e.g. URL ?mode=repeat handling) between opens.
	if (typeof refreshDrawerSettingsState === "function") refreshDrawerSettingsState();
	requestAnimationFrame(updateDrawerScrollHint);
}
function scrollActiveTrackIntoView(){
	const row = $tracklist.querySelector(".track-row.is-active");
	if (!row) return;
	row.scrollIntoView({block:"center", inline:"nearest", behavior:"auto"});
	updateDrawerScrollHint();
}
function closeDrawer(){
	$drawer.classList.remove("is-open");
	$drawer.classList.remove("has-scroll-more");
	$drawerScrim.classList.remove("is-open");
	$drawer.setAttribute("aria-hidden","true");
	$drawerScrim.setAttribute("aria-hidden","true");
	$listBtn.focus();
	const mb = document.getElementById("menuBtn");
	if (mb) mb.setAttribute("aria-expanded", "false");
}
$listBtn.addEventListener("click", ()=>{ ackTap($listBtn); openDrawer(); });
$drawerClose.addEventListener("click", closeDrawer);
$drawerScrim.addEventListener("click", closeDrawer);
$drawer.querySelector(".drawer-body")?.addEventListener("scroll", updateDrawerScrollHint, {passive:true});
window.addEventListener("resize", updateDrawerScrollHint);

// Hamburger menu — same target as the bottom-right "N tracks ◆"
// button but discoverable for first-time visitors. Sets aria-expanded
// so screen readers / keyboard users know what they're activating.
const $menuBtn = document.getElementById("menuBtn");
if ($menuBtn) {
	$menuBtn.addEventListener("click", () => {
		const isOpen = $drawer.classList.contains("is-open");
		if (isOpen) {
			closeDrawer();
			$menuBtn.setAttribute("aria-expanded", "false");
		} else {
			openDrawer();
			$menuBtn.setAttribute("aria-expanded", "true");
		}
	});
}

// Drawer settings rows — clicking a row sets the corresponding mode
// directly (not a toggle-cycle like the inline shortcut). State stays
// in sync with the floating mode-meta buttons; both surfaces reflect
// the same `mode` / `content` variables.
function setMode(target) {
	if (mode === target) return;
	mode = target;
	reshuffle(activeIdx);
	applyRepeatLoop();
	updateModeLabel();
	buildTracklist();
	updateActiveRow();
	refreshDrawerSettingsState();
}
function setContent(target) {
	if (content === target) return;
	content = target;
	updateContentLabel();
	updateCounts();
	reshuffle(activeIdx);
	buildTracklist();
	updateActiveRow();
	refreshDrawerSettingsState();
	// Re-apply bg via the same fallthrough that toggleContent uses.
	if (typeof setBg === "function" && activeIdx >= 0 && TRACKS[activeIdx]) {
		setBg(TRACKS[activeIdx].image || "");
	}
}
function refreshDrawerSettingsState() {
	document.querySelectorAll(".drawer-row[data-mode]").forEach((btn) => {
		btn.classList.toggle("is-active", btn.dataset.mode === mode);
	});
	document.querySelectorAll(".drawer-row[data-content]").forEach((btn) => {
		btn.classList.toggle("is-active", btn.dataset.content === content);
	});
}
document.querySelectorAll(".drawer-row[data-mode]").forEach((btn) => {
	btn.addEventListener("click", () => setMode(btn.dataset.mode));
});
document.querySelectorAll(".drawer-row[data-content]").forEach((btn) => {
	btn.addEventListener("click", () => setContent(btn.dataset.content));
});

// ─────────────────────────────────────────────────────────────────
// Drifting motes
// ─────────────────────────────────────────────────────────────────
(function spawnMotes(){
	const root = document.getElementById("motes");
	// Trimmed from 14 to 6 — each mote is its own compositor layer
	// with an infinite animation. Six is enough to keep the page
	// feeling alive while reducing continuous compositor cost.
	const n = 6;
	for (let i=0;i<n;i++){
		const el = document.createElement("span");
		el.className = "mote";
		const size = 2 + Math.random()*3;
		el.style.width = size+"px";
		el.style.height = size+"px";
		el.style.left = (Math.random()*100).toFixed(2)+"%";
		el.style.top  = (Math.random()*100).toFixed(2)+"%";
		el.style.setProperty("--dur", (8 + Math.random()*14).toFixed(1)+"s");
		el.style.setProperty("--delay", (-Math.random()*15).toFixed(1)+"s");
		root.appendChild(el);
	}
})();

// ─────────────────────────────────────────────────────────────────
// Dynamic count labels — recompute whenever TRACKS changes (init)
// or visibility changes (content toggle). The brand-meta + drawer-
// foot show the visible count; the "All ◆ N ◆" button matches.
// ─────────────────────────────────────────────────────────────────
function updateCounts(){
	const n = visibleIndices().length;
	const word = spellNumber(n);
	const piece = (window.lirienT && window.lirienT(n === 1 ? "echoes.count.piece" : "echoes.count.pieces")) || (n === 1 ? "piece" : "pieces");
	const track = (window.lirienT && window.lirienT(n === 1 ? "echoes.count.track" : "echoes.count.tracks")) || (n === 1 ? "track" : "tracks");
	// $trackCountLabel was the redundant "X pieces" text in the header
	// — removed (the same info is in the player track-info area).
	// Keep this guard so the JS doesn't throw on the missing element.
	if ($trackCountLabel) $trackCountLabel.textContent = `${word} ${piece}`;
	$listBtnCount.textContent = word;
	$listBtnUnit.textContent = track;
	// drawerCountLabel lived in the now-removed drawer-foot block.
	// Nullsafe guard — without it, the throw on null was breaking
	// the entire boot path before buildTracklist() could populate
	// the drawer, leaving it empty.
	if ($drawerCountLabel) $drawerCountLabel.textContent = capFirst(word);
}

// Exposed so the i18n module can re-run the dynamic-text path
// when the user switches language at runtime — applyLang() walks
// every [data-i18n] but the mode/content/count labels are
// JS-driven and need a refresh hook.
window.echoesRefreshDynamicLabels = function(){
	if (typeof updateModeLabel === "function") updateModeLabel();
	if (typeof updateContentLabel === "function") updateContentLabel();
	if (typeof updateCounts === "function") updateCounts();
	// Re-render the title/caption pair so the playing track's caption
	// flips to the new locale (and the default-state placeholder flips
	// too when no track is active).
	if (typeof renderTrackInfo === "function") renderTrackInfo();
	// Rebuild the drawer track-list so each row's caption flips locale.
	// buildTracklist resets the DOM, so re-apply the active-row marker.
	if (typeof buildTracklist === "function") buildTracklist();
	if (typeof updateActiveRow === "function") updateActiveRow();
	if (typeof renderOfflinePanel === "function") renderOfflinePanel();
};

// ─────────────────────────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────────────────────────
(async function init(){
	// Render default placeholders in the current locale immediately,
	// so first paint matches the chosen language. (The i18n module
	// boots before this script defines renderTrackInfo, so its
	// initial applyLang() can't reach these elements anymore — we
	// rendered them statically as English in the HTML, so do it
	// here on the first init tick.)
	renderTrackInfo();
	try {
		await loadTracks();
	} catch (err) {
		console.error("[jukebox] failed to load tracks.json", err);
		$trackTitle.textContent = "Could not load the music";
		$trackCaption.textContent = "tracks.json missing or unreadable";
		return;
	}
	// Load the progression manifest in parallel-ish — its absence is
	// not fatal (played mode falls back to chapter granularity).
	await Promise.all([loadMusicProgression(), loadEchoesAssetManifest()]);
	const detected = detectReachedChapter();
	const isStandalone = window.matchMedia("(display-mode: standalone)").matches
	                     || window.navigator.standalone === true;
	if (isStandalone){
		// PWA install (Add to Home Screen). iOS sandboxes localStorage
		// per PWA, so the reader's save (lirien.save written by Safari
		// at the same origin) isn't visible here. "Played" mode would
		// always show empty + Lirien Remembers, which is misleading;
		// "Minimal" hides the catalog. Force "all" so the PWA functions
		// as a full jukebox regardless of reader progress, and hide the
		// content-mode toggle so the user can't get into a confusing
		// state. The mode toggle (shuffled/sequential) stays.
		content = "all";
		reachedChapter = Math.max(1, detected);
		$contentToggle.hidden = true;
	} else if (detected === 0){
		// New visitor: default to "all" so the full catalog is
		// immediately audible. Steve 2026-05-11: a first-time visitor
		// hasn't read the book yet, so they have no narrative context
		// for any of the tracks — there's no spoiler exposure. Better
		// to give them the whole album as a first impression than
		// "minimal" (just the title theme on repeat) which feels thin.
		// reachedChapter still tracks at 1 so a later switch to
		// "played" picks up the chapter-1 set as a soft entry.
		content = "all";
		reachedChapter = 1;
	} else {
		reachedChapter = detected;
		// content stays "played" — the default
	}

	// Restore persisted settings (mode + activeIdx) before reshuffle.
	// reshuffle() reads `mode` to decide queue order, and uses
	// `activeIdx` to sync queueIdx after regenerating. Without this,
	// a refresh while playing track 7 in sequential mode would land
	// on track 0 in shuffled (the default) on next boot.
	const VALID_MODES = ["shuffled", "sequential", "repeat"];
	const persisted = loadStoredState();
	if (persisted && VALID_MODES.indexOf(persisted.mode) !== -1){
		mode = persisted.mode;
	}
	if (persisted && typeof persisted.activeIdx === "number"
	    && persisted.activeIdx >= 0 && persisted.activeIdx < TRACKS.length){
		activeIdx = persisted.activeIdx;
	}

	// URL params win over persisted state — these are how someone
	// shares a link to a specific song-and-mode landing.
	const urlParams = parseUrlParams();
	if (urlParams.mode && VALID_MODES.indexOf(urlParams.mode) !== -1){
		mode = urlParams.mode;
	}
	let urlSongIdx = -1;
	if (urlParams.song){
		urlSongIdx = findTrackBySlug(urlParams.song);
		if (urlSongIdx !== -1) activeIdx = urlSongIdx;
	}

	updateModeLabel();
	updateContentLabel();
	updateCounts();
	reshuffle();
	buildTracklist();
	bindOfflinePanel();
	refreshOfflineState();
	bootOfflineIntegrityCheck();

	// Soft-restore the previously-active track on reload / PWA reopen.
	// Source of truth is activeIdx (just restored from localStorage,
	// or overridden by URL ?song=). Without this, a tap on Play used
	// to fall into the activeIdx<0 branch of play() and advance the
	// queue by one (Steve: "I had to get to the next track before it
	// would start playing"). Pre-loading audio.src + visible state
	// means the next tap on Play picks up exactly where the user left.
	let restored = false;
	const restoreIdx = (urlSongIdx !== -1) ? urlSongIdx
	                   : (activeIdx >= 0 ? activeIdx
	                      : (queueIdx >= 0 && queueIdx < queue.length ? queue[queueIdx] : -1));
	if (restoreIdx != null && restoreIdx >= 0 && restoreIdx < TRACKS.length){
		const track = TRACKS[restoreIdx];
		if (track){
			activeIdx = restoreIdx;
			// Sync queueIdx to the track's position in the current
			// queue (it may differ from the persisted queueIdx if a
			// URL ?song= override landed on a different track).
			const qPos = queue.indexOf(restoreIdx);
			if (qPos !== -1) queueIdx = qPos;
			$audio.src = trackAudioUrl(track);
			// Repeat mode loops the active track; otherwise per-track
			// loop only applies in minimal mode (seamless Lirien Remembers).
			$audio.loop = (mode === "repeat") || (!!track.loop && content === "minimal");
			$trackTitle.textContent = track.title;
			$trackCaption.textContent = captionFor(track, currentLang());
			updateActiveRow();
			setBg(track.image);
			restored = true;
			// If we landed here via a URL ?song= override, try to
			// auto-play. Browser autoplay policy may block (no prior
			// user gesture on this page) — that's fine, the user
			// taps Play and we resume from the loaded track.
			if (urlSongIdx !== -1){
				const p = $audio.play();
				if (p && p.catch) p.catch(()=>{ /* autoplay blocked */ });
			}
			// Persist the resolved activeIdx (might differ from the
			// blob's, if a URL override or queueIdx fallback landed
			// elsewhere). Without this the next refresh forgets the
			// override and falls back to the prior session's track.
			persistState();
		}
	}
	if (!restored){
		// Fresh session — prime the bg without setting audio.src.
		// Minimal mode = wide Solrien vista; otherwise = first queued
		// track's chapter image (avoids a jarringly black first paint).
		const primeUrl = (content === "minimal")
			? HERO_BG_PATH
			: (queue.length
				? trackImageUrl(TRACKS[queue[0]])
				: HERO_BG_PATH);
		$bgA.style.backgroundImage = `url("${primeUrl}")`;
		$bgA.classList.add("is-active");
	}
})();
</script>
</body>
</html>

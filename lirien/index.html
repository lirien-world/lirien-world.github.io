<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<title>Chronicles of Lirien</title>
	<link rel="apple-touch-icon" href="../aerin_portrait.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="bg" class="bg"></div>
	<div id="title-screen" class="title-screen">
		<div class="title-content">
			<div class="title-eyebrow">Book One &mdash; Chronicles of Lirien</div>
			<h1 class="title-main">The Spiral That <em>Remembers</em></h1>
			<p class="title-tagline">The world forgot itself.<br>One man is walking forward into what remains.</p>
		</div>
		<div id="title-hint" class="title-hint">
			<span class="title-hint-loading">loading&hellip;</span>
			<span class="title-hint-ready" hidden>
				<span class="title-hint-line"></span>
				<span class="title-hint-text">Enter</span>
			</span>
		</div>
	</div>
	<div id="chapter-title" class="chapter-title">
		<div class="chapter-number"></div>
		<div class="chapter-name"></div>
	</div>
	<div id="game" class="game">
		<div id="prose" class="prose">
			<div id="prose-content" class="prose-content"></div>
		</div>
		<div id="continue-hint" class="continue-hint" aria-hidden="true">
			<svg viewBox="0 0 24 12" aria-hidden="true">
				<path d="M2 2 L12 10 L22 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
			</svg>
		</div>
		<div id="choices" class="choices"></div>
	</div>
	<button id="settings-btn" class="settings-btn" aria-label="Settings"></button>
	<div id="settings-panel" class="settings-panel" hidden>
		<div class="settings-heading">Reading speed</div>
		<button class="speed-btn" data-multiplier="0.2">Very slow</button>
		<button class="speed-btn" data-multiplier="0.3">Slow</button>
		<button class="speed-btn" data-multiplier="0.4">Normal</button>
		<button class="speed-btn" data-multiplier="0.7">Fast</button>
		<button class="speed-btn" data-multiplier="1.0">Very fast</button>
		<div class="settings-divider"></div>
		<div class="settings-heading">Text size</div>
		<button class="size-btn" data-size="28">Small</button>
		<button class="size-btn" data-size="32">Medium</button>
		<button class="size-btn" data-size="36">Large</button>
		<button class="size-btn" data-size="42">Very large</button>
		<div class="settings-divider"></div>
		<div class="settings-heading">Music</div>
		<button class="music-btn" data-music="on">On</button>
		<button class="music-btn" data-music="off">Off</button>
	</div>
	<div id="rotate-prompt" class="rotate-prompt">Please rotate your device to landscape</div>
	<script src="ink.js"></script>
	<script src="main.js"></script>
</body>
</html>

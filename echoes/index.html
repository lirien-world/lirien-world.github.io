<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08060f">
<title>Lirien · The Spiral Plays</title>
<meta name="description" content="The music of The Spiral That Remembers — the spiral plays when you ask it to.">
<meta name="robots" content="noindex,nofollow">
<meta name="author" content="Steven Jordan">
<meta name="copyright" content="© 2026 Steven Jordan. All rights reserved.">

<!-- PWA — homescreen-installable, plays music in the background.
     iOS Safari: apple-mobile-web-app-capable + status-bar-style
     enable a chrome-less standalone display when the user adds
     to homescreen. apple-touch-icon points at the spiral icon.
     manifest.webmanifest covers Android / Chromium browsers. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-v3.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32-v3.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48-v3.png">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96-v3.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Installed-as-PWA homescreen tile reads as "Echoes" so it's
     visually + textually distinct from the main "Lirien" book/
     game install. The manifest's full name "Lirien's Echoes"
     shows in the install prompt. -->
<meta name="apple-mobile-web-app-title" content="Echoes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
:root{
	--void:#08060f;--deep:#100d1c;--mid:#1c1828;--ash:#7a7090;--mist:#a89ec0;
	--lavender:#b8a8cc;--cream:#ede5d4;--parchment:#f5eed8;--gold:#c4935a;--gold-bright:#e0b070;
	--space-md:clamp(3rem,6vw,6rem);--space-lg:clamp(5rem,10vw,10rem);
	--text-xs:clamp(0.68rem,1.4vw,0.8rem);--text-sm:clamp(0.9rem,1.8vw,1.05rem);
	--text-body:clamp(1rem,2vw,1.1rem);--text-md:clamp(1.4rem,3vw,2rem);
	--text-lg:clamp(1.9rem,4.5vw,3rem);--text-xl:clamp(2.8rem,8vw,6rem);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
	background:var(--void);color:var(--cream);
	font-family:'EB Garamond',Georgia,serif;font-size:var(--text-body);line-height:1.7;
	-webkit-font-smoothing:antialiased;
	/* Allow vertical scroll if content exceeds viewport — protects
	   against the iOS-Safari dynamic-chrome edge case where the
	   bottom controls would otherwise tuck behind the URL/nav bar.
	   Horizontal stays hidden so the bg-drift transform can't
	   introduce a side-scroll. */
	overflow-x:hidden;overflow-y:auto;
	min-height:100vh;min-height:100dvh;
	/* Kill iOS double-tap-zoom site-wide. Single-tap still fires
	   immediately (also kills the legacy 300ms delay) and pinch-zoom
	   is preserved for accessibility. The drawer slider's
	   `touch-action:none` for drag-to-seek still wins on its own
	   element via specificity. */
	touch-action:manipulation;
}
body.is-standalone-display{
	position:fixed;
	inset:0;
	width:100%;
	height:max(var(--echoes-viewport-height,100dvh),100lvh);
	min-height:max(var(--echoes-viewport-height,100dvh),100lvh);
	overflow:hidden;
}
@media (display-mode:standalone),(display-mode:fullscreen){
	html,body{
		height:max(var(--echoes-viewport-height,100dvh),100lvh);
		min-height:max(var(--echoes-viewport-height,100dvh),100lvh);
		overflow:hidden;
		overscroll-behavior:none;
	}
	.bg-stage,.tint,.grain,.motes{
		inset:0;
		height:auto;
		min-height:100vh;
		min-height:100lvh;
		max-height:none;
		bottom:0;
	}
}

/* ───── BACKGROUND IMAGE LAYER (two stacked, crossfade) ───── */
.bg-stage{position:fixed;inset:0;z-index:0;background:var(--void);overflow:hidden}
.bg-layer{
	position:absolute;inset:-2%;
	background-position:center;background-size:cover;background-repeat:no-repeat;
	transition:opacity 2.4s ease;opacity:0;
	transform:scale(1.04);will-change:transform,opacity;
	/* No animation on the inactive layer — it's opacity:0 anyway, no
	   point spending continuous compositor work animating something
	   nobody can see. Drift starts when the layer becomes active. */
}
.bg-layer.is-active{
	opacity:0.55;
	animation:bg-drift 60s ease-in-out infinite alternate;
}
@keyframes bg-drift{
	0%  {transform:scale(1.04) translate(0,0)}
	100%{transform:scale(1.10) translate(-1.2%,-1.5%)}
}

/* ───── TINT / VIGNETTE / GRAIN OVERLAYS ───── */
.tint{
	position:fixed;inset:0;z-index:1;pointer-events:none;
	background:
		radial-gradient(ellipse at center,rgba(8,6,15,0.35) 0%,rgba(8,6,15,0.65) 55%,rgba(8,6,15,0.92) 100%),
		linear-gradient(180deg,rgba(8,6,15,0.55) 0%,rgba(8,6,15,0.18) 50%,rgba(8,6,15,0.75) 100%);
}
.grain{
	position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0.07;mix-blend-mode:overlay;
	background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");
}

/* ───── DRIFTING MOTES ───── */
.motes{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.mote{
	position:absolute;border-radius:50%;background:var(--gold-bright);
	opacity:0;animation:mote-shimmer var(--dur,12s) ease-in-out var(--delay,0s) infinite;
	box-shadow:0 0 6px rgba(196,147,90,0.8),0 0 12px rgba(196,147,90,0.4);
}
@keyframes mote-shimmer{
	0%,100%{opacity:0;transform:translateY(0)}
	50%{opacity:0.55;transform:translateY(-30px)}
}

/* ───── PAGE FRAME ───── */
.frame{
	position:relative;z-index:3;
	display:grid;grid-template-rows:auto 1fr auto;
	/* dvh AFTER vh so dvh-supporting browsers use the dynamic
	   value — accounts for iOS Safari's address bar / bottom
	   nav, which 100vh ignores and clips controls behind. */
	min-height:100vh;
	min-height:100dvh;
	padding:clamp(1.25rem,3vw,2.5rem) clamp(1.25rem,4vw,3rem);
	/* Respect iOS safe areas (home indicator, notch) so the
	   bottom controls aren't tucked under the system bar. */
	padding-bottom:max(clamp(1.25rem,3vw,2.5rem),env(safe-area-inset-bottom));
	padding-top:max(clamp(1.25rem,3vw,2.5rem),env(safe-area-inset-top));
	gap:clamp(1.25rem,3vw,2.5rem);
}
@media (display-mode:standalone),(display-mode:fullscreen){
	.frame{
		height:max(var(--echoes-viewport-height,100dvh),100lvh);
		min-height:0;
		overflow:hidden;
	}
}

/* ───── HEADER (brand) ───── */
.brand{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;opacity:0;animation:reveal 1.6s ease forwards 0.2s}
.brand-mark{
	font-family:'Cormorant Garamond',serif;font-size:var(--text-xs);
	letter-spacing:0.32em;text-transform:uppercase;color:var(--mist);
	display:flex;flex-direction:column;gap:0.4rem;
}
.brand-mark .one{color:var(--gold);letter-spacing:0.42em}
.brand-mark .two{font-style:italic;color:var(--mist);letter-spacing:0.18em;text-transform:none;font-size:0.78em}
.brand-meta{
	font-family:'Cormorant Garamond',serif;font-size:var(--text-xs);
	letter-spacing:0.18em;text-transform:none;color:var(--ash);font-style:italic;
	text-align:right;line-height:1.5;
	display:flex;flex-direction:column;align-items:flex-end;gap:0.05rem;
}
/* Floating mode-meta — bottom-right on landscape, hidden on portrait.
 * The drawer is the discoverable path for first-time visitors; this
 * block is a power-user shortcut for repeat users who want quick
 * toggle without opening the drawer. Steve's mom (the canary) didn't
 * find the inline-in-header version, so it stays subordinate now. */
.mode-meta{
	position:fixed;
	bottom:clamp(72px, 14vh, 96px);
	right:clamp(1rem, 3vw, 1.5rem);
	z-index:18;
	display:flex;flex-direction:column;align-items:flex-end;gap:0.1rem;
	font-family:'Cormorant Garamond',serif;font-size:var(--text-xs);
	letter-spacing:0.18em;text-transform:none;color:var(--ash);font-style:italic;
	line-height:1.5;pointer-events:none;
}
.mode-meta .mode-toggle{
	all:unset;cursor:pointer;color:var(--ash);
	font-style:italic;letter-spacing:inherit;font-size:inherit;font-family:inherit;
	transition:color 0.3s ease;
	-webkit-tap-highlight-color:transparent;
	pointer-events:auto;
}
.mode-meta .mode-toggle:hover,.mode-meta .mode-toggle:focus-visible{color:var(--mist);outline:none}
.mode-meta .mode-toggle[hidden]{display:none}
.mode-meta .mode-toggle:hover .mode-value,.mode-meta .mode-toggle:focus-visible .mode-value{color:var(--gold-bright)}
.mode-meta .mode-value{color:var(--gold);transition:color 0.3s ease}
/* Portrait: drawer is the only discoverable path; floating text would
 * compete with seekbar + transport + "N tracks ◆" button. */
@media (orientation: portrait), (max-width: 720px){
	.mode-meta{display:none}
}

/* Hamburger menu button — top-right, always visible. Three-bar icon
 * built from spans (no SVG dependency). Same chrome-btn footprint
 * as the drawer-toggle bottom-right so the two affordances feel
 * like a pair: hamburger opens the drawer, drawer-toggle opens the
 * drawer. Either works; the hamburger is the discoverable one. */
.menu-btn{
	/* Button reset (explicit — `all: unset` here would wipe the
	 * position/top/right declarations below since the cascade reads
	 * top-to-bottom). Steve 2026-05-12: that's exactly the bug that
	 * kept the hamburger stuck wherever document flow put it. */
	appearance:none;
	-webkit-appearance:none;
	font:inherit;color:inherit;
	margin:0;padding:0;
	box-shadow:none;
	/* Top-right corner button. Independent from .frame's padding so
	 * it stays at the corner regardless of how .frame's padding
	 * compresses across breakpoints + PWA modes.
	 *
	 * Top uses max() with env(safe-area-inset-top) to clear the
	 * portrait iOS notch in PWA standalone (the only direction where
	 * the system reserves the top edge).
	 *
	 * Right uses plain clamp — no env(safe-area-inset-right). On a
	 * landscape iPhone with a side notch the notch occupies the
	 * vertical CENTER of the right edge, not the corner; the
	 * hamburger lives above the notch zone, so respecting inset-
	 * right would only push it pointlessly inboard.
	 * Steve 2026-05-12. */
	position:fixed;
	top:max(clamp(0.9rem,2.4vw,1.4rem), env(safe-area-inset-top));
	right:clamp(0.9rem,2.4vw,1.4rem);
	z-index:30;
	/* Box. */
	cursor:pointer;
	width:44px;height:44px;
	display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
	background:rgba(8,6,15,0.55);
	border:1px solid rgba(196,147,90,0.22);
	border-radius:3px;
	transition:background 0.3s ease, border-color 0.3s ease;
	-webkit-tap-highlight-color:transparent;
}
.menu-btn:hover,.menu-btn:focus-visible{
	background:rgba(12,9,22,0.7);
	border-color:rgba(196,147,90,0.6);
	outline:none;
}
.menu-btn .menu-btn-bar{
	display:block;
	width:22px;height:1.5px;
	background:var(--gold);
	transition:background 0.3s ease;
}
.menu-btn:hover .menu-btn-bar,.menu-btn:focus-visible .menu-btn-bar{background:var(--gold-bright)}

/* ───── PLAYER STAGE (the spiral) ───── */
.player{
	/* The player is THE UNIT — spiral, title, caption, and the
	   playback cluster (seekbar + invitation + transport) are all
	   children here, rendered together as one inseparable block.
	   This is what keeps everything from colliding when the
	   viewport gets squeezed: items just stack tighter inside the
	   same container instead of fighting between sibling rows. */
	display:flex;flex-direction:column;align-items:center;justify-content:center;
	gap:clamp(0.6rem,2.5vh,2.4rem);
	padding:clamp(0.5rem,1.2vh,1.4rem) 0;
	min-height:0;
	/* Backstop: in extreme compression the unit shrinks via the
	   vh-driven gaps + spiral sizing; if anything still doesn't
	   fit, clip rather than spill into the brand or controls.
	   Use overflow:clip with overflow-clip-margin so the play
	   button's :focus-visible gold halo (26px box-shadow,
	   triggered after a tap) can bleed past .player's bottom
	   edge into the grid-row gap above the foot — without the
	   bleed allowance the halo gets sliced flat right at the
	   foot row's top edge, reading as a hard cropping artifact.
	   The 40px margin is ~50% headroom on the largest shadow we
	   render. The overflow:hidden line stays as a fallback for
	   browsers that predate overflow:clip support (Safari 16+,
	   Chrome 90+, Firefox 102+). */
	overflow:hidden;
	overflow:clip;
	overflow-clip-margin:40px;
}

.player-controls{
	display:flex;flex-direction:column;align-items:center;
	gap:clamp(0.4rem,1.4vh,0.9rem);
	width:100%;
}

.spiral-wrap{
	position:relative;
	width:min(46vh,min(60vw,420px));
	aspect-ratio:1/1;
	display:flex;align-items:center;justify-content:center;
	opacity:0;animation:reveal-scale 2s ease forwards 0.6s;
}

/* The halo is the spiral's glow. It's a static radial-gradient div
   (cheap, GPU-composited) rather than drop-shadow filters on the
   image itself — drop-shadow on an 820px rotating image was causing
   audio buffer underruns, since the main thread spent every paint
   frame re-blurring the shadow and starved audio scheduling. */
.spiral-halo{
	position:absolute;inset:-15%;border-radius:50%;
	background:radial-gradient(ellipse at center,
		rgba(196,147,90,0.30) 0%,
		rgba(196,147,90,0.14) 28%,
		rgba(196,147,90,0.05) 50%,
		transparent 70%);
	pointer-events:none;
	transition:opacity 1.2s ease;
	opacity:0.5;
}
.is-playing .spiral-halo{
	opacity:1;
	animation:halo-breathe 4.5s ease-in-out infinite;
}
@keyframes halo-breathe{
	0%,100%{transform:scale(1);opacity:0.85}
	50%{transform:scale(1.08);opacity:1}
}

.spiral-button{
	all:unset;cursor:pointer;
	width:100%;height:100%;
	display:flex;align-items:center;justify-content:center;
	border-radius:50%;
	transition:transform 0.6s cubic-bezier(.2,.7,.2,1),filter 0.6s ease;
	-webkit-tap-highlight-color:transparent;
}
@media (hover:hover) and (pointer:fine){
	.spiral-button:hover{transform:scale(1.03);filter:drop-shadow(0 0 24px rgba(196,147,90,0.5))}
}
.spiral-button:focus-visible{outline:none;filter:drop-shadow(0 0 24px rgba(196,147,90,0.7))}
.spiral-button:active{transform:scale(0.98)}
@keyframes spiral-tap-ack{
	0%   {filter:drop-shadow(0 0 24px rgba(196,147,90,0.5));}
	100% {filter:drop-shadow(0 0 0 rgba(196,147,90,0));}
}
.spiral-button.tap-ack{animation:spiral-tap-ack 1s ease-out}

.spiral-img{
	display:block;width:100%;height:100%;object-fit:contain;user-select:none;
	pointer-events:none;-webkit-user-drag:none;
	/* The spiral's tight pivot is slightly above geometric center;
	   tweak transform-origin if/when a perfectly-centered re-export
	   lands. Keeps rotation stable instead of wobbling around a
	   misaligned axis. */
	transform-origin:50% 47%;
	/* Idle vs playing is opacity-only — no filter() on a rotating
	   image. Filters force per-frame pixel work; opacity is a free
	   compositor multiply. The dim state on the dark bg reads as
	   "asleep"; the bright state on the same dark bg reads as
	   "awake". (Tested: was brightness/saturate before, removed to
	   protect Safari's HTMLMediaElement scheduling against compositor
	   contention that produced mid-song pops.) */
	transition:opacity 1.2s ease;
	opacity:0.6;
	will-change:transform;
}
.is-playing .spiral-img{
	opacity:1;
	/* Counter-clockwise, fixed cadence — one revolution every ~140s
	   regardless of song length. CSS animation is GPU-composited
	   and avoids the main-thread cost of per-frame JS transforms. */
	animation:spiral-rotate 140s linear infinite;
}
@keyframes spiral-rotate{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}

/* track-change ripple lives on the wrap (which doesn't rotate) so it
   doesn't fight the JS-driven rotate transform on the img */
.spiral-wrap.is-changing{animation:spiral-pulse 1s ease}
@keyframes spiral-pulse{
	0%{transform:scale(1)}
	35%{transform:scale(0.94)}
	100%{transform:scale(1)}
}

/* ───── TRACK INFO (below spiral) ───── */
.track-info{
	text-align:center;display:flex;flex-direction:column;align-items:center;gap:0.6rem;
	max-width:min(640px,90vw);
	min-height:5rem;
}
.track-title{
	font-family:'Cormorant Garamond',serif;
	font-size:var(--text-md);font-weight:400;font-style:italic;
	color:var(--parchment);
	margin:0;line-height:1.25;
	transition:opacity 0.6s ease,transform 0.6s ease;
	text-shadow:0 0 24px rgba(8,6,15,0.85),0 1px 2px rgba(8,6,15,0.95);
}
.track-caption{
	font-family:'Cormorant Garamond',serif;
	font-size:var(--text-xs);letter-spacing:0.32em;text-transform:uppercase;
	color:var(--gold);margin:0;
	text-shadow:0 0 14px rgba(196,147,90,0.4),0 1px 2px rgba(8,6,15,0.95);
	transition:opacity 0.6s ease;
}
.track-info.is-fading .track-title,.track-info.is-fading .track-caption{opacity:0;transform:translateY(0.4rem)}

/* Invitation text — sits inside .player-controls between the
   seekbar and the transport buttons. Em-dash flourishes flank the
   italic line. Spacing handled by .player-controls' gap. */
.invitation{
	font-family:'Cormorant Garamond',serif;
	font-size:var(--text-sm);font-style:italic;color:var(--mist);
	letter-spacing:0.06em;
	opacity:0;animation:reveal 1.6s ease forwards 1.4s;
	display:flex;align-items:center;justify-content:center;gap:0.8rem;
	/* Transition so the invitation fades out on play AND fades
	   back in on pause — symmetric with the seekbar's glide. The
	   initial-paint reveal still runs via the animation above
	   (one-shot, forwards-locked); after that the transition
	   handles all state changes. */
	transition:opacity 0.7s ease;
}
.invitation::before,.invitation::after{
	content:"";display:inline-block;width:clamp(2rem,5vw,4rem);height:1px;
	background:linear-gradient(to right,transparent,var(--ash),transparent);
}
.invitation.is-hidden{opacity:0;pointer-events:none;animation:none}

/* ───── BOTTOM BAR (drawer toggle only) ─────
   Progress, invitation, and transport now live inside .player so
   the whole unit stays together under compression. The foot just
   anchors the "16 tracks ◆" drawer toggle at the bottom of the
   frame, separate from the unit so it doesn't fight for space. */
.foot{
	display:flex;flex-direction:column;
	opacity:0;animation:reveal 1.6s ease forwards 1.0s;
}
.progress{
	position:relative;height:18px;width:min(560px,86vw);margin:0 auto;
	cursor:pointer;display:flex;align-items:center;
	-webkit-tap-highlight-color:transparent;
	/* Lets the slider own touch events instead of the browser
	   interpreting them as page-scroll — required for drag-to-seek
	   on touch devices. */
	touch-action:none;user-select:none;-webkit-user-select:none;
	/* Float-down on playback start. When idle, the invitation sits
	   between the seekbar and the transport; when playback begins
	   the invitation fades out and the seekbar glides downward
	   into the empty space, landing more visually centered between
	   caption above and transport below. Same easing curve as the
	   page reveal animations, so the motion reads as part of the
	   same visual language. Symmetric — pausing glides it back. */
	transform:translateY(0);
	transition:transform 0.8s cubic-bezier(.2,.7,.2,1);
}
body.is-playing .progress{
	/* The clamp's floor (1.3rem ≈ 21px) is the useful minimum on
	   tight landscape viewports where the vh-driven middle would
	   otherwise compute too small. The vh-driven middle gives
	   roomier viewports a proportionally larger slide. */
	transform:translateY(clamp(1.3rem,3.5vh,2.4rem));
}
.progress:focus-visible{outline:none}
.progress-track{
	position:relative;width:100%;height:1px;
	background:rgba(122,112,144,0.28);
	transition:background 0.3s ease,height 0.3s ease;
}
.progress:hover .progress-track,.progress:focus-visible .progress-track{
	background:rgba(196,147,90,0.45);height:2px;
}
.progress-fill{
	position:absolute;left:0;top:0;height:100%;width:0;
	background:linear-gradient(90deg,var(--gold) 0%,var(--gold-bright) 100%);
	box-shadow:0 0 8px rgba(196,147,90,0.6);
	transition:width 0.25s linear;
}
.progress-fill::after{
	content:"";position:absolute;right:-3px;top:50%;transform:translateY(-50%);
	width:7px;height:7px;border-radius:50%;
	background:var(--gold-bright);box-shadow:0 0 10px rgba(196,147,90,0.9);
	transition:opacity 0.4s ease;
}
.is-paused .progress-fill::after{opacity:0.4}

/* ───── TRANSPORT (prev / play-pause / next) ───── */
.transport{
	display:flex;align-items:center;justify-content:center;
	gap:clamp(0.9rem,2.5vw,1.6rem);
	margin-top:16px;
}
.tx-btn{
	all:unset;cursor:pointer;
	width:46px;height:46px;border-radius:50%;
	display:flex;align-items:center;justify-content:center;
	color:var(--mist);
	border:1px solid rgba(196,147,90,0.18);
	background:rgba(8,6,15,0.32);
	transition:color 0.35s ease,border-color 0.35s ease,
	            background 0.35s ease,box-shadow 0.35s ease,transform 0.2s ease;
	-webkit-tap-highlight-color:transparent;
}
/* Hover styles are gated behind (hover:hover) so iOS Safari
   doesn't stick the hover state on after a tap (sticky-hover
   bug — tap fires :hover and it stays glued until the user
   taps elsewhere). On touch devices, the .tap-ack class added
   by JS runs a glow-then-fade animation instead, giving brief
   acknowledgment without the lingering glow. Keyboard users
   still get :focus-visible. */
@media (hover:hover) and (pointer:fine){
	.tx-btn:hover{
		color:var(--gold-bright);
		border-color:rgba(196,147,90,0.55);
		background:rgba(196,147,90,0.08);
		box-shadow:0 0 18px rgba(196,147,90,0.28);
		transform:scale(1.05);
	}
}
.tx-btn:focus-visible{
	color:var(--gold-bright);
	border-color:rgba(196,147,90,0.55);
	background:rgba(196,147,90,0.08);
	box-shadow:0 0 18px rgba(196,147,90,0.28);
	transform:scale(1.05);
	outline:none;
}
.tx-btn:active{transform:scale(0.96)}
.tx-btn[disabled]{opacity:0.35;pointer-events:none}
.tx-btn svg{width:50%;height:50%;display:block}
/* The play/pause button sits a touch larger and starts gold to
   read as the primary action. */
.tx-btn--play{
	width:60px;height:60px;
	color:var(--gold);
	border-color:rgba(196,147,90,0.42);
}
@media (hover:hover) and (pointer:fine){
	.tx-btn--play:hover{
		color:var(--gold-bright);
		border-color:rgba(224,176,112,0.7);
		box-shadow:0 0 26px rgba(196,147,90,0.5);
	}
}
.tx-btn--play:focus-visible{
	color:var(--gold-bright);
	border-color:rgba(224,176,112,0.7);
	box-shadow:0 0 26px rgba(196,147,90,0.5);
	outline:none;
}

/* Tap acknowledgment — a brief glow that fades out, applied via
   the .tap-ack class added by JS on click (and removed on
   animation end). Touch users get a clear "I heard you" without
   the iOS sticky-hover lingering forever. The keyframes fade
   from full hover-equivalent glow to none over 1s. */
@keyframes tx-btn-tap-ack{
	0%   {box-shadow:0 0 26px rgba(196,147,90,0.5); border-color:rgba(224,176,112,0.7);}
	100% {box-shadow:0 0 0 rgba(196,147,90,0); border-color:rgba(196,147,90,0.42);}
}
.tx-btn.tap-ack,.tx-btn--play.tap-ack{
	animation:tx-btn-tap-ack 1s ease-out;
}
.tx-btn--play svg{width:46%;height:46%}
/* CSS-driven icon swap: play icon when paused, pause icon when
   playing. body's is-paused/is-playing class drives the toggle. */
.tx-btn--play .icon-pause{display:none}
.is-playing .tx-btn--play .icon-play{display:none}
.is-playing .tx-btn--play .icon-pause{display:block}

/* ───── BOTTOM CTRL ROW (just the All-N drawer toggle) ───── */
.controls{
	display:flex;align-items:center;justify-content:center;
}
.ctrl{
	all:unset;cursor:pointer;
	font-family:'Cormorant Garamond',serif;font-size:var(--text-xs);
	letter-spacing:0.32em;text-transform:uppercase;color:var(--mist);
	padding:0.5rem 0.2rem;
	transition:color 0.4s ease,letter-spacing 0.4s ease;
	-webkit-tap-highlight-color:transparent;
}
@media (hover:hover) and (pointer:fine){
	.ctrl:hover{color:var(--gold-bright);letter-spacing:0.42em}
}
.ctrl:focus-visible{color:var(--gold-bright);letter-spacing:0.42em;outline:none}
.ctrl[disabled]{opacity:0.4;pointer-events:none}
.ctrl .glyph{display:inline-block;margin:0 0.45em;color:var(--gold);transform:translateY(-1px)}
@keyframes ctrl-tap-ack{
	0%   {color:var(--gold-bright); letter-spacing:0.42em;}
	100% {color:var(--mist);        letter-spacing:0.32em;}
}
.ctrl.tap-ack{animation:ctrl-tap-ack 1s ease-out}

/* ───── DRAWER (track list) ───── */
.drawer-scrim{
	position:fixed;inset:0;z-index:8;background:rgba(8,6,15,0.78);
	backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
	opacity:0;pointer-events:none;transition:opacity 0.5s ease;
}
.drawer-scrim.is-open{opacity:1;pointer-events:auto}

.drawer{
	position:fixed;top:0;right:0;bottom:0;z-index:9;
	width:min(440px,92vw);
	background:rgba(16,13,28,0.92);
	border-left:1px solid rgba(196,147,90,0.22);
	transform:translateX(100%);
	transition:transform 0.6s cubic-bezier(.2,.7,.2,1);
	display:flex;flex-direction:column;
	/* iOS PWA standalone puts the drawer's top edge under the notch /
	 * status bar and its bottom under the home indicator. Pad each
	 * device-touching edge by max(designed-padding, safe-area-inset)
	 * so MENU/CLOSE clear the system controls. Left edge is interior
	 * (drawer is anchored to the right), no inset needed there.
	 * Steve 2026-05-12. */
	padding:
		max(clamp(1.5rem,3vw,2.5rem), env(safe-area-inset-top))
		max(clamp(1.5rem,3vw,2.5rem), env(safe-area-inset-right))
		max(clamp(1.5rem,3vw,2.5rem), env(safe-area-inset-bottom))
		clamp(1.5rem,3vw,2.5rem);
	overflow:hidden;
}
.drawer.is-open{transform:translateX(0)}
.drawer-head{
	flex-shrink:0;
	display:flex;justify-content:space-between;align-items:baseline;
	margin-bottom:1.5rem;padding-bottom:1.25rem;
	border-bottom:1px solid rgba(196,147,90,0.18);
}
.drawer-title{
	font-family:'Cormorant Garamond',serif;font-size:var(--text-sm);
	letter-spacing:0.42em;text-transform:uppercase;color:var(--gold);margin:0;
}
.drawer-close{
	all:unset;cursor:pointer;
	font-family:'Cormorant Garamond',serif;font-size:var(--text-xs);
	letter-spacing:0.32em;text-transform:uppercase;color:var(--mist);
	padding:0.4rem 0.6rem;transition:color 0.3s ease;
}
.drawer-close:hover{color:var(--gold-bright)}

/* Drawer body — single scroll container holding tracklist + settings.
 * Tracks at the top, settings collapsed at the bottom (Steve picked
 * this order so tracks dominate). Whole column scrolls so a long
 * track list + an expanded settings group both reach the user on
 * short viewports. */
.drawer-body{
	flex:1 1 auto;
	min-height:0;
	overflow-y:auto;
	-webkit-overflow-scrolling:touch;
	display:flex;flex-direction:column;
	gap:1rem;
	padding-right:0.15rem;
	scrollbar-width:thin;
	scrollbar-color:rgba(196,147,90,0.55) rgba(245,235,210,0.08);
}
.drawer-body::-webkit-scrollbar{width:5px}
.drawer-body::-webkit-scrollbar-track{background:rgba(245,235,210,0.08)}
.drawer-body::-webkit-scrollbar-thumb{
	background:rgba(196,147,90,0.55);
	border-radius:3px;
}
.drawer.has-scroll-more .drawer-body{
	-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 calc(100% - 26px),transparent 100%);
	mask-image:linear-gradient(to bottom,#000 0%,#000 calc(100% - 26px),transparent 100%);
}
.drawer.has-scroll-more .drawer-body::after{
	content:"";
	position:sticky;
	bottom:0.25rem;
	align-self:flex-end;
	width:0;height:0;
	margin-top:-0.5rem;
	margin-right:0.45rem;
	border-left:0.34em solid transparent;
	border-right:0.34em solid transparent;
	border-top:0.38em solid rgba(224,176,112,0.82);
	filter:drop-shadow(0 0 6px rgba(196,147,90,0.45));
	pointer-events:none;
}

/* Settings section — collapsible groups for play order + content
 * scope, sitting at the bottom of the drawer body (below the
 * track list). Both groups collapsed by default so they don't
 * eat space. Active row gets a gold ◆ marker + brighter rim.
 *
 * Built with native <details>/<summary> for the accordion mechanics
 * (no JS for expand/collapse). The summary marker is hidden via
 * list-style:none + ::-webkit-details-marker:none; we draw our own
 * caret that rotates when [open] is set. */
.drawer-settings{
	display:flex;flex-direction:column;gap:0.4rem;
	padding-top:0.8rem;
	border-top:1px solid rgba(196,147,90,0.18);
	margin-top:0.4rem;
}
.drawer-rights{
	margin-top:0.5rem;
	padding:0.9rem 0.25rem 0;
	border-top:1px solid rgba(196,147,90,0.12);
	font-family:'Cormorant Garamond',serif;
	font-size:clamp(0.66rem,1.2vw,0.76rem);
	line-height:1.45;
	letter-spacing:0.04em;
	color:rgba(245,235,210,0.46);
}
.drawer-rights a{
	color:var(--gold);
	text-decoration:none;
	border-bottom:1px solid rgba(196,147,90,0.28);
	transition:color 0.3s ease,border-color 0.3s ease;
}
.drawer-rights a:hover,.drawer-rights a:focus-visible{
	color:var(--gold-bright);
	border-color:rgba(224,176,112,0.65);
	outline:none;
}
.drawer-settings-group{
	border:none;
}
.drawer-settings-summary{
	all:unset;cursor:pointer;
	display:flex;align-items:center;justify-content:space-between;
	padding:0.55rem 0.25rem;
	color:var(--ash);
	transition:color 0.3s ease;
	list-style:none;  /* Firefox + Safari triangle marker */
	-webkit-tap-highlight-color:transparent;
}
.drawer-settings-summary::-webkit-details-marker{display:none}  /* Chrome/Safari */
.drawer-settings-summary::marker{display:none}                  /* Firefox */
.drawer-settings-summary:hover,
.drawer-settings-summary:focus-visible{color:var(--cream);outline:none}
.drawer-settings-label{
	font-family:'Cormorant Garamond',serif;
	font-size:var(--text-xs);
	letter-spacing:0.22em;
	text-transform:uppercase;
}
.drawer-settings-caret{
	display:inline-block;
	width:0.6em;height:0.4em;
	transition:transform 0.25s ease, color 0.3s ease;
	color:rgba(196,147,90,0.55);
}
.drawer-settings-caret::before{
	content:"";
	display:block;
	width:0;height:0;
	border-left:0.32em solid transparent;
	border-right:0.32em solid transparent;
	border-top:0.36em solid currentColor;
	margin:auto;
}
.drawer-settings-group[open] > .drawer-settings-summary .drawer-settings-caret{
	transform:rotate(180deg);
	color:var(--gold);
}
.drawer-settings-rows{
	display:flex;flex-direction:column;gap:0.25rem;
	padding:0.2rem 0 0.6rem 0;
}
.drawer-row{
	all:unset;cursor:pointer;
	font-family:'Cormorant Garamond',serif;
	font-style:italic;
	font-size:var(--text-sm);
	color:var(--cream);
	padding:0.55rem 0.8rem;
	border:1px solid rgba(196,147,90,0.18);
	border-radius:3px;
	background:rgba(8,6,15,0.45);
	transition:color 0.3s ease, background 0.3s ease, border-color 0.3s ease;
	-webkit-tap-highlight-color:transparent;
}
.drawer-row:hover,.drawer-row:focus-visible{
	color:var(--parchment);
	background:rgba(12,9,22,0.7);
	border-color:rgba(196,147,90,0.45);
	outline:none;
}
.drawer-row.is-active{
	color:var(--gold-bright);
	border-color:rgba(196,147,90,0.7);
	background:rgba(196,147,90,0.08);
}
.drawer-row.is-active::before{
	content:"◆ ";
	color:var(--gold);
	margin-right:0.4rem;
	font-style:normal;
	letter-spacing:0;
}
.offline-panel{
	display:flex;
	flex-direction:column;
	gap:0.42rem;
	padding:0.3rem 0.2rem 0.65rem;
	font-family:'Cormorant Garamond',serif;
	font-size:clamp(0.86rem,2.4vw,1rem);
	color:var(--mist);
}
.offline-panel .offline-intro{
	margin:0 0 0.15rem;
	font-style:italic;
	line-height:1.45;
	color:rgba(245,235,210,0.72);
}
.offline-panel .offline-line{
	display:flex;
	justify-content:space-between;
	gap:0.7rem;
	line-height:1.25;
}
.offline-panel .lbl{
	color:rgba(245,235,210,0.52);
	font-style:italic;
}
.offline-panel .val{
	color:var(--mist);
	font-variant-numeric:tabular-nums;
	text-align:right;
}
.offline-panel .val.ok{color:var(--gold-bright)}
.offline-panel .val.warn{color:#e89a6e}
.offline-panel .offline-progress{
	height:4px;
	background:rgba(245,235,210,0.12);
	border-radius:3px;
	overflow:hidden;
	margin:0.15rem 0 0.1rem;
}
.offline-panel .offline-progress-bar{
	height:100%;
	width:0%;
	background:linear-gradient(90deg,rgba(196,147,90,0.82),rgba(224,176,112,1));
	transition:width 0.2s ease-out;
}
.offline-panel .offline-actions{
	display:flex;
	flex-wrap:wrap;
	gap:0.42rem;
	margin-top:0.3rem;
}
.offline-panel .offline-btn{
	all:unset;
	cursor:pointer;
	font-family:'Cormorant Garamond',serif;
	font-style:italic;
	font-size:clamp(0.88rem,2.4vw,1rem);
	letter-spacing:0.03em;
	color:var(--gold-bright);
	padding:0.42rem 0.68rem;
	border:1px solid rgba(196,147,90,0.42);
	border-radius:3px;
	background:rgba(8,6,15,0.38);
	transition:color 0.3s ease,background 0.3s ease,border-color 0.3s ease;
	-webkit-tap-highlight-color:transparent;
}
.offline-panel .offline-btn--ghost{
	color:rgba(245,235,210,0.65);
	border-color:rgba(245,235,210,0.25);
}
.offline-panel .offline-btn:hover,
.offline-panel .offline-btn:focus-visible{
	outline:none;
	background:rgba(196,147,90,0.1);
	border-color:rgba(196,147,90,0.72);
}
.drawer-tracklist-header{
	font-family:'Cormorant Garamond',serif;
	font-size:var(--text-xs);
	letter-spacing:0.22em;
	text-transform:uppercase;
	color:var(--ash);
	padding:0 0 0.6rem 0;
	flex-shrink:0;
}

.tracklist{
	list-style:none;padding:0;margin:0;
	display:flex;flex-direction:column;gap:0.15rem;
	/* Tracks no longer scroll independently — the whole drawer-body
	 * scrolls together so settings (now at the bottom) are reachable. */
}
.track-row{
	all:unset;cursor:pointer;display:grid;grid-template-columns:2.2rem 1fr;align-items:baseline;
	padding:0.7rem 0.5rem 0.7rem 0;
	border-bottom:1px dashed rgba(122,112,144,0.18);
	transition:background 0.3s ease,padding 0.3s ease;
}
.track-row:hover,.track-row:focus-visible{background:rgba(196,147,90,0.06);padding-left:0.4rem;outline:none}
.track-row .num{
	font-family:'Cormorant Garamond',serif;font-size:var(--text-xs);
	letter-spacing:0.18em;color:var(--ash);font-variant-numeric:tabular-nums;
}
.track-row .meta{display:flex;flex-direction:column;gap:0.18rem;min-width:0}
.track-row .name{
	font-family:'Cormorant Garamond',serif;font-size:var(--text-sm);
	font-style:italic;color:var(--cream);font-weight:400;line-height:1.3;
}
.track-row .where{
	font-family:'Cormorant Garamond',serif;font-size:var(--text-xs);
	letter-spacing:0.28em;text-transform:uppercase;color:var(--ash);
}
.track-row.is-active{background:rgba(196,147,90,0.1)}
.track-row.is-active .num{color:var(--gold-bright)}
.track-row.is-active .name{color:var(--parchment)}
.track-row.is-active .where{color:var(--gold)}
.track-row.is-active .num::before{content:"◆ ";color:var(--gold);letter-spacing:0;font-size:0.85em}

@media (max-height:520px),(max-width:720px){
	.drawer-body{gap:0.55rem}
	.drawer-settings{gap:0.25rem;padding-top:0.55rem;margin-top:0.25rem}
	.drawer-settings-summary{padding:0.38rem 0.2rem}
	.drawer-settings-rows{gap:0.18rem;padding:0.12rem 0 0.4rem 0}
	.drawer-row{font-size:clamp(0.82rem,2.3vw,0.95rem);padding:0.4rem 0.55rem}
	.tracklist{gap:0.06rem}
	.track-row{
		grid-template-columns:1.7rem 1fr;
		padding:0.42rem 0.35rem 0.42rem 0;
	}
	.track-row .name{font-size:clamp(0.84rem,2.4vw,0.98rem);line-height:1.16}
	.track-row .where{font-size:clamp(0.56rem,1.8vw,0.68rem);letter-spacing:0.18em}
	.track-row .num{font-size:clamp(0.58rem,1.8vw,0.7rem);letter-spacing:0.12em}
}

.drawer-foot{
	flex-shrink:0;
	margin-top:auto;padding-top:1.5rem;
	font-family:'Cormorant Garamond',serif;font-size:var(--text-xs);
	font-style:italic;color:var(--ash);letter-spacing:0.06em;line-height:1.6;
}

/* Language switcher: fixed bottom-left, small + unobtrusive.
   Sits below the floor of the player UI, doesn't compete with the
   seekbar (full-width along bottom) or the drawer-toggle button
   (lower-right). Opens upward. iOS-aware insets so it doesn't
   slide under the home indicator in landscape. */
.echoes-lang{position:fixed;bottom:max(0.6rem,env(safe-area-inset-bottom));left:max(0.8rem,env(safe-area-inset-left));z-index:8;font-family:'Cormorant Garamond',serif;font-size:var(--text-xs);letter-spacing:0.18em;text-transform:uppercase}
.echoes-lang-toggle{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:0.4rem;padding:0.35rem 0.5rem;color:var(--ash);opacity:0.65;transition:color 0.3s ease,opacity 0.3s ease;font-weight:500;-webkit-tap-highlight-color:transparent}
.echoes-lang-toggle:hover,.echoes-lang-toggle:focus-visible,.echoes-lang-toggle.open{color:var(--gold-bright);opacity:1;outline:none}
.echoes-lang-caret{width:0.55em;height:0.32em;opacity:0.7;transition:transform 0.3s ease}
.echoes-lang-toggle.open .echoes-lang-caret{transform:rotate(180deg)}
.echoes-lang-dropdown{position:absolute;bottom:calc(100% + 0.35rem);left:0;background:rgba(10,8,18,.95);border:1px solid rgba(196,147,90,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:0.2rem 0;box-shadow:0 -10px 28px rgba(0,0,0,.55);opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity 0.25s ease,transform 0.25s ease;z-index:120;line-height:1}
.echoes-lang-dropdown.open{opacity:1;pointer-events:auto;transform:translateY(0)}
.echoes-lang-item{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:0.55rem;padding:0.45rem 0.75rem;color:var(--ash);transition:color 0.3s ease,background 0.3s ease;width:100%;box-sizing:border-box;white-space:nowrap;line-height:1.1;font-weight:500}
.echoes-lang-item:hover,.echoes-lang-item:focus-visible{color:var(--gold-bright);background:rgba(196,147,90,.08);outline:none}
.echoes-lang-item[aria-pressed="true"]{color:var(--gold)}
.echoes-lang-item[aria-pressed="true"] .lang-code{color:var(--gold-bright);text-shadow:0 0 8px rgba(196,147,90,.4)}
.echoes-lang-item .lang-code{letter-spacing:0.18em;min-width:1.6em}
.echoes-lang-item .lang-name{font-style:italic;font-size:0.95em;letter-spacing:0.06em;text-transform:none;color:inherit;opacity:0.85;font-weight:400}

/* Hidden diagnostics: backtick on keyboard, or three-finger tap on iOS.
   Kept intentionally plain so screenshots are readable during PWA
   viewport debugging. */
.echoes-debug{
	position:fixed;left:50%;bottom:max(1rem,env(safe-area-inset-bottom));
	transform:translateX(-50%);z-index:1000;width:min(720px,calc(100vw - 2rem));
	max-height:min(78vh,640px);overflow:auto;padding:1rem 1.1rem;
	background:rgba(8,6,15,.96);border:1px solid rgba(196,147,90,.35);
	box-shadow:0 18px 50px rgba(0,0,0,.65);color:var(--cream);
	font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
	font-size:12px;line-height:1.45;letter-spacing:0;
}
.echoes-debug[hidden]{display:none}
.echoes-debug-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.75rem}
.echoes-debug-title{font-family:'Cormorant Garamond',serif;font-size:1.1rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.echoes-debug-close{all:unset;cursor:pointer;color:var(--mist);font-size:1.5rem;line-height:1;padding:.1rem .35rem}
.echoes-debug-close:hover,.echoes-debug-close:focus-visible{color:var(--gold-bright);outline:none}
.echoes-debug-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.3rem .9rem}
.echoes-debug .label{color:var(--ash)}
.echoes-debug .value{color:var(--gold-bright);word-break:break-word}

/* ───── ANIMATIONS ───── */
@keyframes reveal{from{opacity:0;transform:translateY(0.6rem)}to{opacity:1;transform:translateY(0)}}
@keyframes reveal-scale{from{opacity:0;transform:scale(0.94)}to{opacity:1;transform:scale(1)}}

/* ───── REDUCED MOTION ───── */
@media (prefers-reduced-motion:reduce){
	*,*::before,*::after{
		animation-duration:0.01ms!important;animation-iteration-count:1!important;
		transition-duration:0.01ms!important;
	}
	.is-playing .spiral-img{animation:none}
	.is-playing .spiral-halo{animation:none}
}

/* ───── SMALL SCREENS ───── */
@media (max-width:480px){
	.brand-meta{font-size:0.65rem}
	.controls{gap:1.4rem}
	.ctrl-list{margin-left:0;width:100%;text-align:center;padding-top:0.5rem}
}

/* ───── COMPACT VERTICAL — phones with iOS chrome / short windows ─────
   When height is tight (e.g. iPhone SE in Safari with the URL bar
   visible eats ~120px), pull the page in vertically so the transport
   + drawer toggle stay within the visible viewport without forcing
   a scroll. Triggers on shorter heights regardless of orientation. */
@media (max-height:760px){
	.frame{gap:clamp(0.5rem,1.5vw,1.2rem);padding:clamp(0.75rem,2vw,1.5rem) clamp(1.25rem,4vw,3rem)}
	.spiral-wrap{width:min(30vh,55vw,320px)}
	.player{gap:clamp(0.5rem,1.8vh,1.4rem);padding:clamp(0.3rem,0.8vh,0.8rem) 0}
	.player-controls{gap:clamp(0.3rem,1vh,0.7rem)}
	.track-info{min-height:0;gap:0.4rem}
}

/* Even tighter for very short viewports (landscape phones, browser
   chrome eating most of the height). */
@media (max-height:520px){
	.spiral-wrap{width:min(26vh,40vw,240px)}
	.brand-mark .two{display:none}     /* drop the secondary tagline */
	/* min-height:0 + height:100dvh lets the grid absorb any
	   squeeze. We deliberately do NOT set overflow:hidden on body
	   here — in non-PWA Safari the URL bar dynamically eats dvh,
	   so content sized for a wider dvh would be silently clipped
	   below the fold (with no scroll fallback) when the bar
	   reappears. Letting the body scroll as fallback is the
	   non-broken behaviour; PWA standalone gets strict no-scroll
	   below. */
	.frame{min-height:0;height:100vh;height:100dvh}
}

/* Landscape phones — wide + short. Browser chrome (URL bar + tab
   strip) and the iOS home-indicator safe-area both eat dvh, so
   everything compresses to fit without scrolling.
   These values used to be split across a base rule + a (display-
   mode:browser)-qualified rule, but iOS Safari's matching of
   (display-mode:browser) is unreliable across versions — when it
   silently fails to match, the layout overflows on real iPhones.
   Folding the tight values into the unqualified rule guarantees
   they apply everywhere; the standalone-PWA rule below this can
   re-override the few values that should be looser in PWA mode. */
@media (orientation:landscape) and (max-height:480px){
	.frame{
		gap:clamp(0.2rem,0.6vh,0.4rem);
		padding:max(0.2rem,env(safe-area-inset-top))
		       clamp(1rem,3vw,2rem)
		       max(0.2rem,env(safe-area-inset-bottom));
	}
	.spiral-wrap{width:min(16vh,22vw,120px)}
	/* padding-bottom keeps the transport's gold play-button rim
	   from sitting flush against the foot's "N tracks ◆" toggle
	   in the grid row below. Without it the two read as one
	   crowded cluster even though they're in separate rows. */
	.player{gap:clamp(0.25rem,0.8vh,0.6rem);padding:0 0 clamp(0.5rem,1.4vh,1rem) 0}
	.player-controls{gap:clamp(0.15rem,0.5vh,0.4rem)}
	.track-info{gap:0.15rem}
	.track-title{font-size:1.05rem}
	.track-caption{font-size:0.72em}
	.invitation{font-size:0.78em}
	.transport{gap:clamp(0.6rem,1.8vw,1rem);margin-top:6px}
	.tx-btn{width:38px;height:38px}
	.tx-btn--play{width:48px;height:48px}
	.controls{gap:1rem}
	.ctrl{padding:0.25rem 0.2rem}
	.ctrl-list{padding-top:0.2rem}
	/* Brand-meta goes horizontal so the header collapses from 3
	   stacked lines (~63px) to one line (~22px). Recovered ~40px
	   of vertical space without losing any information. */
	.brand-meta{flex-direction:row;gap:1rem;line-height:1.2}
}

/* Standalone-PWA-specific (Add to Home Screen, opens chrome-less).
   Strict fit + no scroll: the PWA is a fixed-frame app, scrolling
   here would feel like a layout bug. Non-PWA Safari keeps its
   polite scroll fallback if dynamic URL-bar dvh shrinkage pushes
   content past the bottom. */
@media (display-mode:standalone) and (orientation:landscape){
	body{overflow:hidden}
	.frame{padding-left:max(0.5rem,env(safe-area-inset-left));
	       padding-right:max(0.5rem,env(safe-area-inset-right))}
	.spiral-wrap{width:min(18vh,24vw,140px)}
}

<!-- preload="auto" so iOS Safari starts buffering as soon as src is set;
     playsinline so audio doesn't pop into a fullscreen video player on
     iOS; x-webkit-airplay defaults to "allow" so AirPlay just works. -->
<audio id="audio" preload="auto" playsinline crossorigin="anonymous"></audio>

<script>
/* Audio adapter — drives HTML5 <audio> on the web; in the Capacitor
 * iOS app, routes through @capacitor-community/native-audio
 * (AVAudioPlayer under the hood) so pause/resume and background
 * playback are reliable.
 *
 * Bundled-music note: Echoes references files under ../lirien/music/
 * which sit outside the iOS bundle (only website/echoes/ is webDir).
 * For v1 the native path streams from https://lirien.world/lirien/...
 * Lock-screen Now Playing controls are a follow-up; web mediaSession
 * doesn't bridge to AVAudioPlayer.
 */
"use strict";
window.createAudioAdapter = function(htmlEl){
	var Cap = window.Capacitor;
	// Prefer the StreamingAudio plugin (AVPlayer-backed, supports HTTP
	// streaming + reliable pause/resume). Fall back to NativeAudio
	// (AVAudioPlayer-backed, local files only) if it's the only thing
	// available. In a web browser neither is present and we use HTMLAudio.
	var native = (Cap && Cap.isNativePlatform && Cap.isNativePlatform())
		? (Cap.Plugins && (Cap.Plugins.StreamingAudio || Cap.Plugins.NativeAudio)) : null;
	if (!native) return htmlEl;  // web: HTMLAudio unchanged

	var DEBUG = false; // flip to true to surface adapter activity in console
	var log = DEBUG ? function(){ console.log.apply(console, ["[audio-native]"].concat([].slice.call(arguments))); } : function(){};

	try { native.configure({focus: true, fade: false}); } catch (e) {}

	var ev = new EventTarget();
	var state = {
		src: "", assetId: null, loadedIds: Object.create(null),
		duration: NaN, currentTime: 0,
		paused: true, ended: false, loop: false,
		readyState: 0, error: null,
		pollTimer: null, loadSeq: 0
	};
	function fire(type){ ev.dispatchEvent(new Event(type)); }
	function idOf(url){ return "echoes:" + String(url).split("?")[0]; }
	function resolveForNative(url){
		if (!url) return url;
		if (/^https?:\/\//i.test(url)) return url;
		try { return new URL(url, "https://lirien.world/echoes/").href; }
		catch (e) { return url; }
	}

	// Natural end-of-track. Loop-mode: replay; else fire 'ended'.
	if (native.addListener) {
		try {
			native.addListener("complete", function(e){
				if (!e || e.assetId !== state.assetId) return;
				if (state.loop) {
					state.currentTime = 0;
					try { native.play({assetId: state.assetId, time: 0}); } catch (_) {}
					return;
				}
				state.ended = true; state.paused = true;
				stopPolling();
				fire("ended");
			});
		} catch (_) {}
		// Lock-screen / Control Center remote commands from iOS.
		// Native handles play/pause/toggle/seek on the AVPlayer side; we
		// fire synthetic events here so the in-app UI (play button,
		// progress bar) stays in sync, and next/previous get routed back
		// to the JS player logic.
		try {
			native.addListener("remoteCommand", function(e){
				var cmd = e && e.command;
				if (cmd === "play")  { state.paused = false; startPolling(); fire("play"); }
				else if (cmd === "pause") { state.paused = true;  stopPolling(); fire("pause"); }
				else if (cmd === "toggle") {
					state.paused = !state.paused;
					if (state.paused) { stopPolling(); fire("pause"); }
					else { startPolling(); fire("play"); }
				}
				else if (cmd === "next") fire("remotenext");
				else if (cmd === "previous") fire("remoteprevious");
				else if (cmd === "seek" && typeof e.time === "number") {
					state.currentTime = e.time;
					fire("timeupdate");
				}
			});
		} catch (_) {}
	}

	function startPolling(){
		if (state.pollTimer) return;
		state.pollTimer = setInterval(function(){
			if (!state.assetId || state.paused) return;
			native.getCurrentTime({assetId: state.assetId}).then(function(r){
				if (r && typeof r.currentTime === "number") {
					state.currentTime = r.currentTime;
					fire("timeupdate");
				}
			}).catch(function(){});
		}, 200);
	}
	function stopPolling(){
		if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
	}

	function loadAsset(url){
		var seq = ++state.loadSeq;
		var id = idOf(url);
		var prev = state.assetId;
		state.assetId = id;
		state.duration = NaN;
		state.currentTime = 0;
		state.readyState = 0;
		state.ended = false;
		state.error = null;

		var unloadPrev = (prev && prev !== id && state.loadedIds[prev])
			? native.unload({assetId: prev}).catch(function(){})
			: Promise.resolve();

		unloadPrev.then(function(){
			if (prev && prev !== id) delete state.loadedIds[prev];
			if (state.loadedIds[id]) return;
			var resolved = resolveForNative(url);
			var isUrl = /^https?:\/\//i.test(resolved);
			log("preload", id, resolved);
			return native.preload({assetId: id, assetPath: resolved, isUrl: isUrl});
		}).then(function(){
			if (seq !== state.loadSeq) return;
			state.loadedIds[id] = true;
			return native.getDuration({assetId: id}).catch(function(){ return null; });
		}).then(function(r){
			if (seq !== state.loadSeq) return;
			if (r && typeof r.duration === "number") state.duration = r.duration;
			state.readyState = 4;
			fire("loadedmetadata");
			fire("canplay");
		}).catch(function(err){
			if (seq !== state.loadSeq) return;
			log("preload-failed", id, err && err.message);
			state.error = {code: 4, message: String((err && err.message) || err)};
			fire("error");
		});
	}

	var adapter = {
		get src(){ return state.src; },
		set src(v){
			if (v === state.src) return;
			state.src = v || "";
			if (state.assetId && !state.paused) {
				try { native.pause({assetId: state.assetId}); } catch (_) {}
				state.paused = true;
				stopPolling();
			}
			if (v) loadAsset(v);
		},
		get currentTime(){ return state.currentTime; },
		set currentTime(t){
			var max = isFinite(state.duration) ? state.duration : Infinity;
			state.currentTime = Math.max(0, Math.min(t, max));
			if (state.assetId && !state.paused) {
				try { native.play({assetId: state.assetId, time: state.currentTime}); } catch (_) {}
			}
		},
		get duration(){ return state.duration; },
		get paused(){ return state.paused; },
		get ended(){ return state.ended; },
		get readyState(){ return state.readyState; },
		get error(){ return state.error; },
		get loop(){ return state.loop; },
		set loop(v){ state.loop = !!v; },
		play: function(){
			if (!state.assetId) return Promise.reject(new Error("no source"));
			var wasPaused = state.paused;
			var resumeMid = wasPaused && state.currentTime > 0 && !state.ended;
			var p = resumeMid
				? native.resume({assetId: state.assetId})
				: native.play({assetId: state.assetId, time: state.currentTime || 0});
			return p.then(function(){
				state.paused = false;
				state.ended = false;
				fire("play");
				startPolling();
			});
		},
		pause: function(){
			if (!state.assetId || state.paused) return;
			try { native.pause({assetId: state.assetId}); } catch (_) {}
			state.paused = true;
			stopPolling();
			fire("pause");
		},
		load: function(){
			if (state.src) { var u = state.src; state.src = ""; adapter.src = u; }
		},
		// Push track metadata to iOS Now Playing (lock screen, Control
		// Center, Dynamic Island, AirPods double-tap UI). Safe to call
		// repeatedly; the plugin caches artwork by URL so it only
		// downloads when the artwork changes.
		setNowPlayingInfo: function(info){
			if (!native.setNowPlayingInfo) return Promise.resolve();
			return native.setNowPlayingInfo({
				title: (info && info.title) || "",
				artist: (info && info.artist) || "Lirien",
				album: (info && info.album) || "Echoes of Lirien",
				duration: (info && Number.isFinite(info.duration)) ? info.duration : (isFinite(state.duration) ? state.duration : 0),
				artwork: (info && info.artwork) || ""
			}).catch(function(){});
		},
		clearNowPlayingInfo: function(){
			if (!native.clearNowPlayingInfo) return Promise.resolve();
			return native.clearNowPlayingInfo().catch(function(){});
		},
		isNative: true,
		addEventListener: ev.addEventListener.bind(ev),
		removeEventListener: ev.removeEventListener.bind(ev),
		dispatchEvent: ev.dispatchEvent.bind(ev),
	};
	return adapter;
};
</script>

<script>
"use strict";

// iOS standalone PWAs can resume with a stale layout viewport and a
// non-zero page scroll, leaving a dead strip below the app frame until
// the user nudges the page. In installed mode, pin the frame to the
// visual viewport and re-seat scroll on resume/resize.
(function () {
	const root = document.documentElement;
	const standaloneMq = window.matchMedia ? window.matchMedia("(display-mode: standalone)") : null;
	const fullscreenMq = window.matchMedia ? window.matchMedia("(display-mode: fullscreen)") : null;
	function isStandaloneDisplay() {
		return (standaloneMq && standaloneMq.matches)
			|| (fullscreenMq && fullscreenMq.matches)
			|| window.navigator.standalone === true;
	}
	function syncViewportHeight() {
		const vv = window.visualViewport;
		const standalone = isStandaloneDisplay();
		document.body.classList.toggle("is-standalone-display", standalone);
		const candidates = [
			vv && vv.height,
			window.innerHeight,
			document.documentElement && document.documentElement.clientHeight,
			standalone && window.screen && window.screen.height,
			standalone && window.screen && window.screen.availHeight,
		].filter((value) => Number.isFinite(value) && value > 0);
		const height = Math.round(Math.max.apply(Math, candidates));
		if (height > 0) root.style.setProperty("--echoes-viewport-height", height + "px");
		if (standalone) {

// ─────────────────────────────────────────────────────────────────
// PWA freshness check. iOS standalone (Add to Home Screen) caches
// HTML + JS at install time and won't refresh on its own — users
// would be stuck on whatever build was live the day they installed.
// Compare a baked BUILD_VERSION against /version.json on boot AND
// every time the PWA returns to foreground; reload silently on
// mismatch. localStorage survives the reload so saves are intact.
// Bump the version with tools/bump_pwa_version.sh echoes after
// each /echoes/ deploy that needs to propagate to existing PWAs.
// ─────────────────────────────────────────────────────────────────
(function pwaFreshnessCheck(){
	const BUILD_VERSION = "20260515-182236";  // bump on echoes/ deploys
	window.ECHOES_BUILD_VERSION = BUILD_VERSION;
	const POLL_INTERVAL_MS = 90_000;
	const INTERACTION_RATE_LIMIT_MS = 60_000;
	let inFlight = false;
	let lastCheck = 0;
	async function check(force){
		const now = Date.now();
		if (!force && now - lastCheck < INTERACTION_RATE_LIMIT_MS) return;
		if (inFlight) return;
		inFlight = true;
		lastCheck = now;
		try {
			const r = await fetch("/version.json?t=" + Date.now(), {cache:"no-store"});
			if (!r.ok) return;
			const data = await r.json();
			const live = data.echoes;
			if (live && live !== BUILD_VERSION){
				// Don't reload mid-playback — the user is enjoying
				// the music and a full nav would kill the audio
				// element and force them to tap Play again (and on
				// iOS PWA the lock-screen control is already
				// finicky enough — Steve hit this). Defer until
				// audio is paused or ended; the next check() tick
				// after that will fire the reload.
				const a = document.getElementById("audio");
				if (a && !a.paused && !a.ended){
					console.log("[freshness] stale build but playing — deferring reload");
					return;
				}
				console.log("[freshness] stale build " + BUILD_VERSION + " → " + live + ", reloading");
				// Cache-bust the URL on reload — iOS PWA standalone
				// can serve the same stale HTML from browser HTTP
				// cache when location.reload() is called, defeating
				// the whole freshness-check pattern. Adding a unique
				// query param forces a brand-new request.
				const url = new URL(location.href);
				url.searchParams.set("_v", live);
				location.replace(url.toString());
			}
		} catch (e) { /* offline — try again next check */ }
		finally { inFlight = false; }
	}
	// Initial check after first paint.
	setTimeout(() => check(true), 1500);
	// Periodic poll catches updates while the user stays in-app.
	setInterval(() => check(true), POLL_INTERVAL_MS);
	// Resume-from-background — always check, force-bypassing rate limit.
	document.addEventListener("visibilitychange", () => {
		if (!document.hidden) check(true);
	});
	// User-interaction trigger — picks up updates while the user is
	// actively clicking around. Rate-limited so taps don't hammer.
	document.addEventListener("pointerdown", () => check(false), { passive: true });
})();

// ─────────────────────────────────────────────────────────────────
// Service worker — cache-as-you-go for audio + images. Registered
// up-front so anything fetched later this session benefits. Honors
// ?clear-cache (or ?nocache) by sending a purge message and then
// reloading once the cache is empty.
// ─────────────────────────────────────────────────────────────────
(function setupServiceWorker(){
	if (!("serviceWorker" in navigator)) return;
	const params = new URLSearchParams(location.search);
	const wantsPurge = params.has("clear-cache") || params.has("nocache");

	const swVersion = encodeURIComponent(window.ECHOES_BUILD_VERSION || "dev");
	navigator.serviceWorker.register("sw.js?v=" + swVersion).then((reg) => {
		// If the user asked to clear cache, message the active worker
		// and reload to a clean URL once it's done.
		if (!wantsPurge) return;
		const send = () => {
			const target = reg.active || navigator.serviceWorker.controller;
			if (!target){
				// Worker isn't ready yet — try again on the next tick.
				navigator.serviceWorker.addEventListener("controllerchange", send, { once: true });
				return;
			}
			target.postMessage({ type: "purge" });
		};
		send();
	}).catch((err) => {
		console.warn("[jukebox] sw register failed", err);
	});

	if (wantsPurge){
		navigator.serviceWorker.addEventListener("message", (ev) => {
			if (ev.data && ev.data.type === "purged"){
				// Strip the cache-busting params and reload to a clean URL.
				const cleanUrl = location.pathname + location.hash;
				location.replace(cleanUrl);
			}
		});
	}
})();

// ─────────────────────────────────────────────────────────────────
// Debug panel — backtick on desktop, three-finger tap on iOS.
// Gives real standalone viewport values from the device so we can
// distinguish CSS viewport, visual viewport, safe area, and service
// worker state without guessing from screenshots.
// ─────────────────────────────────────────────────────────────────
(function setupDebugPanel(){
	const panel = document.getElementById("echoesDebug");
	const grid = document.getElementById("echoesDebugGrid");
	const close = document.getElementById("echoesDebugClose");
	if (!panel || !grid || !close) return;

	function escapeHtml(value){
		return String(value).replace(/[&<>"']/g, (ch) => ({
			"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
		})[ch]);
	}
	function round(value){
		return Number.isFinite(value) ? Math.round(value * 10) / 10 : "(n/a)";
	}
	function rectSummary(selector){
		const el = document.querySelector(selector);
		if (!el) return "(missing)";
		const r = el.getBoundingClientRect();
		return `${round(r.top)}-${round(r.bottom)} h${round(r.height)}`;
	}
	function safeAreaValue(edge){
		const probe = document.createElement("div");
		probe.style.cssText = `position:fixed;visibility:hidden;padding-${edge}:env(safe-area-inset-${edge});`;
		document.body.appendChild(probe);
		const value = parseFloat(getComputedStyle(probe).getPropertyValue(`padding-${edge}`)) || 0;
		probe.remove();
		return value;
	}
	async function serviceWorkerInfo(){
		if (!("serviceWorker" in navigator)) return "unsupported";
		try {
			const reg = await navigator.serviceWorker.getRegistration();
			const active = reg && reg.active && reg.active.scriptURL;
			const waiting = reg && reg.waiting && reg.waiting.scriptURL;
			const controller = navigator.serviceWorker.controller && navigator.serviceWorker.controller.scriptURL;
			return `ctrl:${controller || "none"} active:${active || "none"} wait:${waiting || "none"}`;
		} catch (err) {
			return `error:${err && err.message ? err.message : err}`;
		}
	}
	async function render(){
		const vv = window.visualViewport;
		const html = document.documentElement;
		const body = document.body;
		const frame = document.querySelector(".frame");
		const bg = document.querySelector(".bg-stage");
		const frameStyle = frame ? getComputedStyle(frame) : null;
		const bgStyle = bg ? getComputedStyle(bg) : null;
		const rows = [
			["build", window.ECHOES_BUILD_VERSION || "(unknown)"],
			["mode", `mq:${window.matchMedia && window.matchMedia("(display-mode: standalone)").matches ? "standalone" : "browser"} nav:${window.navigator.standalone === true ? "standalone" : "normal"}`],
			["viewport", `inner ${round(innerWidth)}x${round(innerHeight)} outer ${round(outerWidth)}x${round(outerHeight)}`],
			["visual", vv ? `${round(vv.width)}x${round(vv.height)} offset ${round(vv.offsetTop)}/${round(vv.offsetLeft)} scale ${round(vv.scale)}` : "none"],
			["screen", window.screen ? `${round(screen.width)}x${round(screen.height)} avail ${round(screen.availWidth)}x${round(screen.availHeight)}` : "none"],
			["client", `html ${round(html.clientWidth)}x${round(html.clientHeight)} body ${round(body.clientWidth)}x${round(body.clientHeight)}`],
			["css var", getComputedStyle(html).getPropertyValue("--echoes-viewport-height").trim() || "(unset)"],
			["safe area", `top ${round(safeAreaValue("top"))} bottom ${round(safeAreaValue("bottom"))}`],
			["scroll", `window ${round(scrollX)}/${round(scrollY)} html ${round(html.scrollWidth)}x${round(html.scrollHeight)} body ${round(body.scrollWidth)}x${round(body.scrollHeight)}`],
			["body class", body.className || "(none)"],
			["frame rect", rectSummary(".frame")],
			["bg rect", rectSummary(".bg-stage")],
			["layer rect", rectSummary(".bg-layer.is-active")],
			["frame css", frameStyle ? `h ${frameStyle.height} min ${frameStyle.minHeight} pb ${frameStyle.paddingBottom}` : "(missing)"],
			["bg css", bgStyle ? `h ${bgStyle.height} min ${bgStyle.minHeight} bottom ${bgStyle.bottom}` : "(missing)"],
			["worker", await serviceWorkerInfo()],
		];
		grid.innerHTML = rows.map(([label, value]) => (
			`<div><span class="label">${escapeHtml(label)}:</span> <span class="value">${escapeHtml(value)}</span></div>`
		)).join("");
	}
	function toggle(force){
		panel.hidden = typeof force === "boolean" ? !force : !panel.hidden;
		if (!panel.hidden) render();
	}
	document.addEventListener("keydown", (ev) => {
		const inText = ev.target && ev.target.matches && ev.target.matches("input, textarea");
		if (ev.code === "Backquote" && !inText) {
			ev.preventDefault();
			toggle();
		} else if (ev.code === "Escape" && !panel.hidden) {
			panel.hidden = true;
		}
	});
	document.addEventListener("touchstart", (ev) => {
		if (ev.touches && ev.touches.length >= 3) {
			ev.preventDefault();
			toggle();
		}
	}, { passive: false });
	close.addEventListener("click", () => { panel.hidden = true; });
	["resize", "orientationchange", "pageshow"].forEach((eventName) => {
		window.addEventListener(eventName, () => { if (!panel.hidden) setTimeout(render, 80); }, { passive: true });
	});
	document.addEventListener("visibilitychange", () => {
		if (!document.hidden && !panel.hidden) setTimeout(render, 80);
	});
})();

// Track manifest. Loaded from tracks.json (sibling file). Each entry
// binds the music file to a chapter atmosphere image (so listening
// is also a montage through the book's images) and gives the piece

let TRACKS = [];
let ECHOES_ASSET_MANIFEST = null;

const MUSIC_BASE = "../lirien/music/";
const ATMOS_BASE = "../lirien/atmosphere/";

// Entries in tracks.json may use either a bare filename (resolved
// against MUSIC_BASE / ATMOS_BASE) or a path starting with "../"
// when the asset lives outside the lirien/ runtime tree (e.g. the
// minimal-mode lirien_theme.mp3 lives in website/ alongside the
// landing page). Detect and pass through.
function trackAudioUrl(track){
	if (!track || !track.file) return "";
	return track.file.startsWith("../") ? track.file : (MUSIC_BASE + track.file);
}
function webpImageUrl(url){
	if (!url) return url;
	return url.replace(/\.(png|jpe?g)(\?.*)?$/i, ".webp$2");
}
function trackImageUrl(track){
	if (!track || !track.image) return HERO_BG_PATH;
	const image = webpImageUrl(track.image);
	return image.startsWith("../") ? image : (ATMOS_BASE + image);
}

// ─────────────────────────────────────────────────────────────────
// Number → word, for the "sixteen pieces" / "All sixteen ◆" labels.
// Covers 0–99 which is all we'll ever realistically need; falls back
// to the digit string for anything larger. Spanish uses feminine
// forms because the nouns we attach (pieza, pista) are both
// feminine — "una pieza", "veintiuna piezas".
// ─────────────────────────────────────────────────────────────────
const SPELL = {
	en: {
		ones: ["zero","one","two","three","four","five","six","seven","eight","nine",
		       "ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen",
		       "seventeen","eighteen","nineteen"],
		tens: ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"],
		sep: "-",
	},
	es: {
		ones: ["cero","una","dos","tres","cuatro","cinco","seis","siete","ocho","nueve",
		       "diez","once","doce","trece","catorce","quince","dieciséis",
		       "diecisiete","dieciocho","diecinueve"],
		tens: ["","","veinte","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"],
		sep: " y ",
	},
};
function spellNumber(n){
	const lang = document.documentElement.lang || "en";
	const tbl = SPELL[lang] || SPELL.en;
	if (n < 20) return tbl.ones[n];
	if (n < 100){
		const t = Math.floor(n/10), o = n%10;
		return o === 0 ? tbl.tens[t] : `${tbl.tens[t]}${tbl.sep}${tbl.ones[o]}`;
	}
	return String(n);
}
function capFirst(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
